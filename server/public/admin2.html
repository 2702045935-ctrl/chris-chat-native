<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · CHRIS Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231c86ee' d='M12 2C6.5 2 2 5.8 2 10.5c0 2.7 1.5 5.1 3.9 6.6L5 21l4-2.1c1 .2 2 .3 3 .3 5.5 0 10-3.8 10-8.7S17.5 2 12 2z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="admin.css">
</head>
<body class="cmf-body">

<div class="cmf-login" id="cmfLogin" hidden>
  <div class="cmf-login-card">
    <div class="cmf-login-title">CHRIS Chat 后台管理中心</div>
    <label>密码</label>
    <input type="password" id="cmfPwd" placeholder="请输入管理密码">
    <button id="cmfLoginBtn">登 录</button>
    <div class="cmf-login-tip" id="cmfLoginTip"></div>
  </div>
</div>

<div class="cmf-wrap" id="cmfWrap" hidden>
  <aside class="cmf-side">
    <div class="cmf-logo">CHRIS Chat</div>
    <nav class="cmf-menu" id="cmfMenu"></nav>
  </aside>

  <div class="cmf-main">
    <header class="cmf-top">
      <div class="cmf-crumb" id="cmfCrumb">数据总览</div>
      <div class="cmf-top-right">
        <button class="cmf-link" id="cmfRefresh">刷新</button>
        <button class="cmf-link" id="cmfLogout">退出</button>
      </div>
    </header>
    <main class="cmf-content" id="cmfContent"></main>
  </div>
</div>

<div class="cmf-modal" id="cmfModal" hidden>
  <div class="cmf-modal-card">
    <div class="cmf-modal-head"><span id="cmfModalTitle">编辑</span><button id="cmfModalClose">×</button></div>
    <div class="cmf-modal-body" id="cmfModalBody"></div>
    <div class="cmf-modal-foot"><button class="cmf-btn ghost" id="cmfModalCancel">取消</button><button class="cmf-btn" id="cmfModalOk">保存</button></div>
  </div>
</div>

<div class="cmf-toast" id="cmfToast" hidden></div>

<script src="admin2.js"></script>
</body>
</html>
