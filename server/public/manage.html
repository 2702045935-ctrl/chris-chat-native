    + '" style="width:90px"' + (writable ? '' : ' disabled') + '> ';
  const colorPick = (path, val, fallback) => '<input type="color" data-kpick="' + path + '" value="'
    + esc(val || fallback) + '" style="width:46px;height:28px;padding:0;vertical-align:middle"' + (writable ? '' : ' disabled') + '> '
    + '<input data-k="' + path + '" value="' + esc(val || '') + '" style="width:110px" placeholder="留空 = 跟主题"'
    + (writable ? '' : ' disabled') + '>';
  let uid = 0;
  const nextId = () => 'sv' + Date.now().toString(36).slice(-5) + (uid++);

  /* ---------------- 真机预览（可以直接上下拖） ----------------
     预览用真机的 420×912 宽度、同一份 m.css 和同一套类名渲染，
     所以「预览里什么样 = 手机上什么样」。拖动时只改版块的 CSS 变量（左右不碰）。 */
  const PV_FIELDS = [
    { key: 'gapTop', label: '上' },
    { key: 'gapBottom', label: '下' }
  ];

  function previewVars(gi) {
    const st = cfg.style || {};
    const gs = ((cfg.groups[gi] || {}).style) || {};
    const icon = Number(st.iconSize) || 28;
    const gText = Number(st.gridTextSize) || 13;
    const gTitle = Number(st.gridTitleSize) || 14;
    const v = [];
    v.push('--sv-title-size:' + gTitle + 'px');
    v.push('--sv-text-size:' + gText + 'px');
    if (st.gridTitleColor && String(st.gridTitleColor).toUpperCase() !== '#7A7A7A') v.push('--sv-title-color:' + st.gridTitleColor);
    if (st.gridTextColor) v.push('--sv-text-color:' + st.gridTextColor);
    if (gs.gapTop !== null && gs.gapTop !== undefined) v.push('--sv-gap-top:' + gs.gapTop + 'px');
    if (gs.gapBottom !== null && gs.gapBottom !== undefined) v.push('--sv-gap-bottom:' + gs.gapBottom + 'px');
    return v.join(';');
  }

  /* 绿卡那层要的变量（图标大小、卡高、文字颜色字号） */
  function previewCardVars() {
    const st = cfg.style || {};
    const icon = Number(st.iconSize) || 28;
    const cName = Number(st.cardTextSize) || 18;
    const cSub = Number(st.cardSubSize) || 12;
    return '--sv-icon:' + icon + 'px;'
      + '--sv-card-h:' + (144 + (icon - 28) + (cName - 18) + (cSub - 12)) + 'px;'
      + '--sv-card-color:' + (st.cardTextColor || '#FFFFFF') + ';'
      + '--sv-card-name-size:' + cName + 'px;'
      + '--sv-card-sub-size:' + cSub + 'px;'
      + '--sv-card-sub-op:' + (st.cardSubOpacity === undefined ? 0.5 : st.cardSubOpacity) + ';';
  }

  const pvHandle = (gi, key) => '<div class="pv-handle" data-pv="' + key + ':' + gi + '"><span>↕ '
    + (key === 'gapTop' ? '上' : '下') + '</span></div>';

  function previewMarkup() {
    const card = cfg.card || {};
    const html = ['<div style="' + previewCardVars() + '">'];
    if (card.enabled !== false) {
      const l = card.left || {};
      const r = card.right || {};
      html.push('<div class="sv-card" style="background-color:' + (card.bg || '#2AAE67') + '">'
        + '<button class="sv-half"><span class="sv-ico" style="color:#fff">' + (l.svg || '') + '</span>'
        + '<span class="sv-name">' + esc(l.label || '收付款') + '</span>'
        + (l.sub ? '<span class="sv-sub">' + esc(l.sub) + '</span>' : '') + '</button>'
        + '<button class="sv-half"><span class="sv-ico" style="color:#fff">' + (r.svg || '') + '</span>'
        + '<span class="sv-name">' + esc(r.label || '钱包') + '</span>'
        + '<span class="sv-sub">' + esc(r.sub || '¥****') + '</span></button></div>');
    }
    (cfg.groups || []).forEach((g, gi) => {
      if (g.enabled === false) return;        // 后台关掉的分类，预览里也不显示（跟手机一致）
      const items = (g.items || []).filter((it) => it.enabled !== false);
      if (!items.length) return;
      html.push('<div class="sv-block" style="' + previewVars(gi) + '">');
      html.push('<div class="sv-title">' + esc(g.title || '') + '</div>');
      html.push('<div class="sv-grid">');
      items.forEach((it) => {
        html.push('<button class="sv-cell"><span class="sv-ico" style="color:' + esc(it.color || '#1180E0') + '">' + (it.svg || '') + '</span>'
          + '<span class="sv-label">' + esc(it.label || '') + '</span></button>');
      });
      html.push('</div>');
      html.push('</div>');
      html.push(pvHandle(gi, 'gapBottom'));
      html.push(pvHandle(gi, 'gapTop'));
    });
    html.push('</div>');
    return html.join('');
  }

  function previewDoc() {
    return '<!doctype html><html><head><meta charset="utf-8">'
      + '<link rel="stylesheet" href="/m.css">'
      + '<style>body{margin:0;background:#ededed;-webkit-font-smoothing:antialiased}'
      + 'body::-webkit-scrollbar{width:0;height:0}html{scrollbar-width:none;-ms-overflow-style:none}'
      /* 拖动条不占高度（只浮在上面），这样预览的间距和手机上完全一样 */
      + '.pv-handle{height:0;position:relative;z-index:6;cursor:ns-resize;user-select:none}'
      + '.pv-handle span{position:absolute;left:50%;transform:translateX(-50%);top:-8px;height:16px;display:inline-flex;align-items:center;font-size:10px;line-height:1;color:#8a8a8a;background:rgba(255,255,255,.95);border:1px dashed #c9c9c9;border-radius:9px;padding:0 8px;white-space:nowrap}'
      + '.pv-handle:active span{background:#07C160;color:#fff;border-color:#07C160}'
      + '</style></head><body>' + previewMarkup() + '</body></html>';
  }

  function renderPreview() {
    const f = $('svPreview');
    if (!f) return;
    let top = 0;
    try { top = f.contentWindow ? f.contentWindow.scrollY : 0; } catch (e) { top = 0; }
    f.onload = () => {
      bindPreviewDrag();
      try { f.contentWindow.scrollTo(0, top); } catch (e) { }
    };
    f.srcdoc = previewDoc();
  }

  function setField(gi, field, val) {
    if (!cfg.groups[gi].style) cfg.groups[gi].style = {};
    cfg.groups[gi].style[field] = val;
    const input = $('content').querySelector('input[data-k="groups.' + gi + '.style.' + field + '"]');
    if (input) input.value = val;
  }

  /* 拖动时用「当前实际生效的值」当起点（版块没配就是全局那套） */
  function effectiveValue(gi, field) {
    const st = cfg.style || {};
    const gs = ((cfg.groups[gi] || {}).style) || {};
    if (gs[field] !== null && gs[field] !== undefined && gs[field] !== '') return Number(gs[field]);
    switch (field) {
      case 'gapTop': return 0;
      case 'gapBottom': return 8;
      default: return 0;
    }
  }

  function bindPreviewDrag() {
    const f = $('svPreview');
    if (!f || !f.contentDocument) return;
    const doc = f.contentDocument;
    doc.querySelectorAll('[data-pv]').forEach((h) => {
      h.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const spec = String(h.getAttribute('data-pv') || '').split(':');
        const field = spec[0];
        const gi = Number(spec[1] || 0);
        if (!PV_FIELDS.some((x) => x.key === field)) return;
        const startY = e.clientY;
        const startVal = effectiveValue(gi, field);
        const block = doc.querySelectorAll('.sv-block')[gi];
        const varName = '--sv-' + (field === 'gapTop' ? 'gap-top' : 'gap-bottom');
        const move = (ev) => {
          let v = Math.round(startVal + (ev.clientY - startY));
          const lo = field === 'gapBottom' ? 8 : 0;
          const hi = 100;
          v = Math.max(lo, Math.min(hi, v));
          if (block) block.style.setProperty(varName, v + 'px');
          setField(gi, field, v);
        };
        const up = () => {
          doc.removeEventListener('pointermove', move);
          doc.removeEventListener('pointerup', up);
          renderPreview();
          saveSoon('版块尺寸已保存');
        };
        doc.addEventListener('pointermove', move);
        doc.addEventListener('pointerup', up);
      });
    });
  }

    $('content').innerHTML = '<div class="panel"><div class="body">'

        let o = cfg;
        for (let i = 0; i < parts.length - 1; i += 1) o = o[parts[i]];
        o[parts[parts.length - 1]] = v;
        /* 换了图标标识就别再留着「上传的那张图」了，否则图会压着新图标不生效 */
        if (/\.icon$/.test(k) && parts.length === 5) {
          cfg.groups[Number(parts[1])].items[Number(parts[3])].svg = '';
        }
        if (/^card\.(left|right)\.icon$/.test(k)) {
          cfg.card[parts[1]].svg = '';      // 换了图标标识就别留着上传的那张图
        }
        if (/\.icon$/.test(k)) draw();
        saveSoon();
      });
    });
    /* 取色器：点一下就写进旁边那个文本框，再照常走保存 */
    $('content').querySelectorAll('[data-kpick]').forEach((el) => {
      el.addEventListener('input', () => {
        const path = el.getAttribute('data-kpick');
        const txt = $('content').querySelector('input[data-k="' + path + '"]');
        if (!txt) return;
        txt.value = String(el.value || '').toUpperCase();
        txt.dispatchEvent(new Event('change', { bubbles: true }));
      });
    });
    const on = (id, fn) => { const el = $(id); if (el) el.addEventListener('click', fn); };
    /* 「上传图片」当图标 / 当绿卡背景：传完直接把地址写进这一格 */
    let upTarget = null;
    $('content').querySelectorAll('[data-upimg]').forEach((b) => b.addEventListener('click', () => {
      const v = b.getAttribute('data-upimg');
      if (v === 'card') upTarget = { card: true };
      else if (v.indexOf('card:') === 0) upTarget = { half: v.split(':')[1] };
      else upTarget = { gi: Number(v.split(':')[0]), ii: Number(v.split(':')[1]) };
      const file = $('svFile');
      if (file) file.click();
    }));
    const fileEl = $('svFile');
    if (fileEl) {
      fileEl.addEventListener('change', () => {
        const f = fileEl.files && fileEl.files[0];
        if (!f || !upTarget) return;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const r = await api('/upload', { method: 'POST', body: { dataUrl: String(reader.result), filename: f.name } });
            /* 上传接口回的是带签名的临时地址（会过期），这里只存路径，服务器每次现签 */
            const url = String((r && r.url) || '').split('?')[0];
            if (upTarget.card) {
              cfg.style.cardImage = url;
            } else if (upTarget.half) {
              cfg.card[upTarget.half].svg = url;
              cfg.card[upTarget.half].icon = '';
            } else {
              const it = cfg.groups[upTarget.gi].items[upTarget.ii];
              it.svg = url;
              it.icon = '';
            }
            upTarget = null;
            fileEl.value = '';
            draw();
            save('图片换好了，前台马上生效');
          } catch (err) { toast(err.message); upTarget = null; }
        };
        reader.readAsDataURL(f);
      });
    }
    on('svStyleReset', () => {
      if (!confirm('样式恢复成默认（绿卡底色和内容不动）？')) return;
      cfg.style = JSON.parse(JSON.stringify((d.defaults || {}).style || {}));
      draw(); save('样式已恢复默认');
    });
    on('svCardBgReset', () => { cfg.card.bg = '#2AAE67'; draw(); save('底色已恢复'); });
    $('svCardOn').addEventListener('change', (e) => { cfg.card.enabled = e.target.checked; saveSoon(); });
    $('svCardBg').addEventListener('change', (e) => { cfg.card.bg = e.target.value; saveSoon(); });
    on('svAddG', () => {
      cfg.groups.push({ id: 'sg' + Date.now().toString(36).slice(-4), title: '新分类', enabled: true, items: [] });
      draw(); save('已加一个分类');
    });
    $('content').querySelectorAll('[data-addi]').forEach((b) => b.addEventListener('click', () => {
      const g = cfg.groups[Number(b.getAttribute('data-addi'))];
      g.items.push({ id: nextId(), label: '新入口', icon: '', color: '#1180E0', action: 'soon', enabled: true, svg: '' });
      draw(); save('已加一格');
    }));
    $('content').querySelectorAll('[data-delg]').forEach((b) => b.addEventListener('click', () => {
      const gi = Number(b.getAttribute('data-delg'));
      if (!confirm('删掉「' + (cfg.groups[gi].title || '') + '」这一整组？')) return;
      cfg.groups.splice(gi, 1); draw(); save('已删掉这一组');
    }));
    $('content').querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => {
      const [gi, ii] = b.getAttribute('data-del').split(':').map(Number);
      if (!confirm('删掉「' + ((cfg.groups[gi].items[ii] || {}).label || '') + '」这一格？')) return;
      cfg.groups[gi].items.splice(ii, 1); draw(); save('已删掉这一格');
    }));
    $('content').querySelectorAll('[data-mv]').forEach((b) => b.addEventListener('click', () => {
      const [gi, ii, dir] = b.getAttribute('data-mv').split(':').map(Number);
      const arr = cfg.groups[gi].items;
      const j = ii + dir;
      if (j < 0 || j >= arr.length) return;
      const t = arr[j]; arr[j] = arr[ii]; arr[ii] = t; draw(); save('顺序已保存');
    }));
    on('svReset', () => {
      if (!confirm('恢复成默认的服务页？（当前改动会丢）')) return;
      cfg = JSON.parse(JSON.stringify(d.defaults));
      cfg.groups = cfg.groups || [];
      draw(); save('已恢复默认');
    });
    on('svSave', async () => {
      try {
        await api('/service', { method: 'POST', body: { service: cfg } });
        toast('已保存，网页版和 App 马上生效');
      } catch (e) { toast(e.message); }
    });
  };
  draw();
};

      const j = v[1] + v[2];
      if (j < 0 || j >= arr.length) return;
      const t = arr[j]; arr[j] = arr[v[1]]; arr[v[1]] = t; draw(); save('顺序已保存');
    }));
    on('waStyleReset', () => {
      if (!confirm('样式恢复成默认（页面内容不动）？')) return;
      cfg.style = JSON.parse(JSON.stringify((d.defaults || {}).style || {}));
      draw(); save('样式已恢复默认');
    });
    on('waReset', () => {
      if (!confirm('整页恢复成默认的钱包页？（当前改动会丢）')) return;
      cfg = JSON.parse(JSON.stringify(d.defaults));
      cfg.groups = cfg.groups || [];
      cfg.footer = cfg.footer || [];
      cfg.style = cfg.style || {};
      draw(); save('已恢复默认');
    });
    on('waSave', async () => {
      try {
        await api('/wallet', { method: 'POST', body: { wallet: cfg } });
        toast('已保存，网页版和 App 马上生效');
      } catch (e) { toast(e.message); }
    });
  };
  draw();
};

function editIcon(it, current, all) {
  const isSf = (it.svg || '').indexOf('sf:') === 0;
  const isImg = /^(https?:|\/uploads|data:)/.test(current);
  /* 内置图标选择器：底栏那 4 个（tab.*）本来是 iOS 系统图标，编辑框里是空的，
     用户点保存只会看到「内容不能为空」。这里把内置的 SVG 图标列出来，点一下就填好。 */
  const picks = (all || []).filter((x) => (x.svg || '').indexOf('<svg') === 0);
  const pickerHtml = picks.length
    ? '<div class="hint" style="margin-top:10px">或者直接从下面挑一个内置图标（点一下就填进上面的框）：</div>'
      + '<div id="icPicks" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;'
      + 'max-height:190px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:10px;margin-top:6px">'
      + picks.map((x, i) => '<button type="button" class="btn ghost" data-pick="' + i + '" title="' + esc(x.name + ' · ' + x.key)
        + '" style="height:52px;padding:4px;display:flex;align-items:center;justify-content:center">'
        + '<span class="iprev" style="width:26px;height:26px">' + x.svg + '</span></button>').join('')
      + '</div>'
    : '';
  openModal(
    '<h3>更换图标：' + esc(it.name) + ' <span class="hint">' + esc(it.key) + '</span></h3>'
    + '<div class="hint">点「上传我的图标」选一张 PNG / JPG / SVG —— 选完立刻生效；也可以从下面挑一个内置图标。'
    + '（贴代码那种高级玩法收起来了，需要就点最后的「显示代码框」）</div>'
    + '<div class="row" style="margin:12px 0;gap:12px;align-items:center">'
    + '<label class="btn main" style="cursor:pointer;padding:12px 18px;font-size:15px">📁 上传我的图标'
    + '<input type="file" id="icf" accept="image/*,.svg" style="display:none"></label>'
    + '<span class="hint" id="icmsg"></span></div>'
    + '<div class="previewbox" style="height:72px"><span id="pvNow"></span></div>'
    + pickerHtml
    + '<div id="icAdvBox" hidden style="margin-top:8px">'
    + '<div class="hint">当前内容（可手动改）：</div>'
    + '<textarea id="icv" style="width:100%;height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px">'
    + esc(current || (isSf ? '' : it.svg)) + '</textarea>'
    + '<button class="btn sm" id="icSave2" style="margin-top:6px">保存框里的内容</button></div>'
    + '<div class="row" style="margin-top:16px">'
    + '<button class="btn ghost" id="icDef">用内置的</button>'
    + '<button class="btn ghost" id="icAdv">显示代码框</button>'
    + '<button class="btn" id="icClose">关闭</button>'
    + '<span class="hint">当前内置：' + esc(isSf ? it.svg : '内置 SVG') + '</span></div>'
  );
  const refresh = () => {
    const v = $('icv').value.trim();
    $('pvNow').innerHTML = v.indexOf('<svg') === 0 ? v
      : (/^(https?:|\/uploads|data:)/.test(v) ? '<img src="' + esc(v) + '" style="width:56px;height:56px;object-fit:contain">'
        : '<span style="font-size:44px">' + esc(v || '？') + '</span>');
  };
  /* 选完立刻保存（不用再点「保存」）：用户反馈那个内容框看不懂，索性不给它出场机会 */
  const saveValue = async (v, msg) => {
    const val = String(v || '').trim();
    if (!val) { toast('没选到内容，再试一次'); return; }
    try {
      await api('/icons', { method: 'POST', body: { key: it.key, name: it.name, value: val } });
      toast(msg || '换好了，App 立刻生效');
      closeModal(); PAGES.icons();
    } catch (e) { toast(e.message); }
  };
  refresh();
  $('icv').addEventListener('input', refresh);
  const picksBox = $('icPicks');
  if (picksBox) {
    picksBox.addEventListener('click', (e) => {
      const b = e.target.closest('[data-pick]');
      if (!b) return;
      const x = picks[Number(b.getAttribute('data-pick'))];
      if (!x) return;
      $('icv').value = x.svg;
      refresh();
      $('icmsg').textContent = '已选：' + x.name;
      saveValue(x.svg, '已换成「' + x.name + '」');
    });
  }
  if ($('icAdv')) $('icAdv').addEventListener('click', () => {
    const box = $('icAdvBox');
    box.hidden = !box.hidden;
    $('icAdv').textContent = box.hidden ? '显示代码框' : '收起代码框';
  });
  if ($('icSave2')) $('icSave2').addEventListener('click', () => {
    const v = $('icv').value.trim();
    if (!v) { toast('框里是空的（想还原就点「用内置的」）'); return; }
    saveValue(v, '已保存框里的内容');
  });
  $('icf').addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    /* 传的是 .svg 文件：直接把里面的代码填进框里（这样图标能跟着底栏变色；
       当图片上传的话，SVG 会被当成一张图，颜色就固定了） */
    if (/\.svg$/i.test(f.name) || f.type === 'image/svg+xml') {
      const t = await f.text();
      $('icv').value = t.trim();
      refresh();
      $('icmsg').textContent = '已读取 SVG';
      saveValue(t.trim(), 'SVG 图标已换好');
      return;
    }
    $('icmsg').textContent = '上传中…';
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const r = await api('/upload', { method: 'POST', body: { dataUrl: String(reader.result), filename: f.name } });
        $('icv').value = r.url;
        refresh();
        $('icmsg').textContent = '传好了：' + r.url;
        saveValue(r.url, '已换成你上传的图标');
      } catch (err) {
        $('icmsg').textContent = '上传失败：' + (err.message || '未知错误');
        toast('上传失败：' + (err.message || '未知错误'));
      }
    };
    reader.readAsDataURL(f);
  });
  $('icClose').addEventListener('click', closeModal);
  $('icDef').addEventListener('click', async () => {
    try {
      await api('/icons', { method: 'POST', body: { key: it.key, name: it.name, value: '' } });
      toast('已还原成内置图标');
      closeModal(); PAGES.icons();
    } catch (e) { toast(e.message); }
  });
  /* 旧的「保存」按钮已经撤掉了：上传/选内置图标都改成选完立刻保存，
     需要手改代码的话走「显示代码框 → 保存框里的内容」（icSave2）。 */
}

/* ---------------- 审计日志的日期工具 ---------------- */
/* 日志时间可能是毫秒数，也可能是 ISO 字符串，统一转成时间戳 */
function tsOf(v) {
  if (typeof v === 'number' && isFinite(v)) return v;
  const n = Date.parse(String(v == null ? '' : v));
  return isNaN(n) ? 0 : n;
}
function dayOf(t) {
  const d = new Date(tsOf(t));
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function cnDay(day) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(day || ''));
  if (!m) return String(day || '');
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const wk = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return m[1] + '年' + Number(m[2]) + '月' + Number(m[3]) + '日 周' + wk;
}
function hm(t) {
  const d = new Date(tsOf(t));
  const p = (n) => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function auditRange(st) {
  const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const day = 86400000;
  const now = d0.getTime();
  if (st.range === 'today') return [now, 0];
  if (st.range === 'yesterday') return [now - day, now - 1];
  if (st.range === '7d') return [now - 6 * day, 0];
  if (st.range === '30d') return [now - 29 * day, 0];
  if (st.range === 'custom') return [dateStart(st.d1), dateEnd(st.d2)];
  return [0, 0];
}
function rangeText(st) {
  if (st.range === 'today') return '今天（' + dayOf(Date.now()) + '）';
  if (st.range === 'yesterday') return '昨天（' + dayOf(Date.now() - 86400000) + '）';
  if (st.range === '7d') return '近 7 天（' + dayOf(Date.now() - 6 * 86400000) + ' 起）';
  if (st.range === '30d') return '近 30 天（' + dayOf(Date.now() - 29 * 86400000) + ' 起）';
  if (st.range === 'custom') {
    if (st.d1 && st.d2 && st.d1 === st.d2) return cnDay(st.d1);
    return (st.d1 || '最早') + ' 至 ' + (st.d2 || '现在');
  }
  return '全部（按时间倒序）';
}
function auditCsv(rows, st) {
  const cell = (v) => {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const head = ['日期', '时间', '操作人', '登录账号', '角色', 'IP', '动作', '对象', '说明'];
  const lines = [head.join(',')].concat(rows.map((a) => [
    dayOf(a.at), hm(a.at), a.name, a.admin, a.role, a.ip, a.action, a.target, a.detail
  ].map(cell).join(',')));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const tag = st.range === 'custom' && st.d1 && st.d1 === st.d2 ? st.d1 : dayOf(Date.now());
  a.href = url;
  a.download = 'CHRIS审计日志_' + tag + '_' + rows.length + '条.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('已导出 ' + rows.length + ' 条到 CSV');
}

/* ---------------------------------------------------------- 自动登录 */

(async () => {
  /* 地址里带了 ?pw=<管理员密码>：先拿它换一个登录态（fetch 同源，Cookie 一定能存下），
     然后把 pw 从地址里去掉再进。方便「浏览器自动填错密码、进不去」的时候用。 */
  try {
    const q = new URLSearchParams(location.search);
    if (q.get('pw')) {
      const r = await fetch('/api/admin/quicklogin?pw=' + encodeURIComponent(q.get('pw')), { credentials: 'same-origin' });
      if (r.ok) {
        const j = await r.json().catch(() => null);
        q.delete('pw');
        try { history.replaceState(null, '', location.pathname + (q.toString() ? ('?' + q.toString()) : '')); } catch (e) { }
        /* 接口直接把「我是谁」给回来了：拿上就进，不用再查会话 */
        if (j && j.ok && j.data && j.data.admin) { ME = j.data.admin; start(); return; }
      }
    }
  } catch (e) { /* 认不出来就当没带，正常显示登录页 */ }
  try {
    const d = await api('/session');
