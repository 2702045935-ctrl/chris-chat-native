<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHRIS 管理后台</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="admin-ui.css">
<!-- 微信后台那套排版（公众平台/商户后台的风格）：左侧白色分组菜单 + 顶部白栏
     + 浅灰内容底 + 白色圆角卡片 + 表单左标签右输入 + 微信绿主按钮。纯样式覆盖，不改功能。 -->
<style id="wx-console-look">
  body { background: #F7F7F7 !important; font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif !important; }

  /* 左侧菜单：白底、分组标题灰色小字、条目 40 高、选中浅绿底 + 绿色左条 */
  #nav { background: #FFFFFF !important; border-right: 1px solid #EDEDED !important; width: 208px !important; }
  #nav .ngroup { color: #9A9A9A !important; font-size: 12px !important; padding: 14px 16px 6px !important; letter-spacing: .5px; }
  #nav button { height: 40px !important; margin: 2px 8px !important; padding: 0 12px !important; border-radius: 6px !important;
                color: #333 !important; font-size: 14px !important; background: transparent !important; border: 0 !important; }
  #nav button:hover { background: #F2F2F2 !important; }
  #nav button.on, #nav button.active, #nav button[aria-current="true"] { background: #EAF9F0 !important; color: #07C160 !important; font-weight: 600 !important; }
  #nav button .n { background: #FA5151 !important; color: #fff !important; border-radius: 9px !important; font-size: 11px !important; padding: 1px 6px !important; }
  #navq { margin: 12px 12px 4px !important; border-radius: 6px !important; border: 1px solid #E5E5E5 !important; }

  /* 顶部栏：白底 + 下细线 */
  header, #top, .topbar { background: #FFFFFF !important; border-bottom: 1px solid #EDEDED !important; }

  /* 内容区：浅灰底 + 白色圆角卡片 */
  #content { background: #F7F7F7 !important; padding: 20px !important; }
  .panel { background: #FFFFFF !important; border: 1px solid #EDEDED !important; border-radius: 8px !important;
           box-shadow: 0 1px 2px rgba(0,0,0,.03) !important; padding: 20px 22px !important; margin-bottom: 14px !important; }
  .panel h3 { font-size: 15px !important; font-weight: 600 !important; color: #191919 !important; margin: 0 0 12px !important;
              padding-left: 10px !important; border-left: 3px solid #07C160 !important; line-height: 1.2 !important; }
  .hint { color: #999 !important; font-size: 12px !important; line-height: 1.7 !important; }

  /* 表单：左标签固定宽，右输入 */
  .kv { display: flex !important; align-items: flex-start !important; gap: 12px !important; padding: 8px 0 !important; }
  .kv > b { flex: 0 0 132px !important; color: #333 !important; font-weight: 400 !important; font-size: 14px !important; line-height: 34px !important; }
  .kv > span { flex: 1 !important; min-width: 0 !important; }
  input, select, textarea { border: 1px solid #E5E5E5 !important; border-radius: 6px !important; padding: 7px 10px !important;
                            font-size: 14px !important; color: #191919 !important; background: #fff !important; }
  input:focus, select:focus, textarea:focus { border-color: #07C160 !important; box-shadow: 0 0 0 2px rgba(7,193,96,.12) !important; outline: 0 !important; }
  .wide { width: 100% !important; box-sizing: border-box !important; }

  /* 按钮：微信绿主按钮 */
  .btn { height: 34px !important; padding: 0 14px !important; border-radius: 6px !important; font-size: 14px !important;
         border: 1px solid #E5E5E5 !important; background: #fff !important; color: #333 !important; }
  .btn.main { background: #07C160 !important; border-color: #07C160 !important; color: #fff !important; }
  .btn.main:hover { background: #06AD56 !important; }
  .btn.ghost { background: transparent !important; color: #666 !important; }
  .btn.sm { height: 28px !important; padding: 0 10px !important; font-size: 12.5px !important; }

  /* 表格：微信后台那种浅灰表头 + 44 行高 + 细线 */
  .tbl { width: 100% !important; border-collapse: collapse !important; font-size: 13.5px !important; }
  .tbl th { background: #FAFAFA !important; color: #8C8C8C !important; font-weight: 500 !important; font-size: 12.5px !important;
            text-align: left !important; padding: 10px 12px !important; border-bottom: 1px solid #EDEDED !important; white-space: nowrap !important; }
  .tbl td { padding: 11px 12px !important; border-bottom: 1px solid #F2F2F2 !important; color: #333 !important; vertical-align: top !important; }
  .tbl tr:hover td { background: #FAFAFA !important; }
  .ok { color: #07C160 !important; }

  /* 弹层 */
  #sheet, .sheet { background: #fff !important; border-radius: 10px !important; box-shadow: 0 8px 30px rgba(0,0,0,.18) !important; }
  #modal { background: rgba(0,0,0,.4) !important; }

  /* 登录页 */
  #login { background: #F7F7F7 !important; }
  .login-box { background: #fff !important; border-radius: 10px !important; box-shadow: 0 4px 22px rgba(0,0,0,.08) !important; padding: 28px 26px !important; }
  .lg-mark { background: #07C160 !important; color: #fff !important; }
  .login-box h1 { font-size: 18px !important; font-weight: 600 !important; }
  .login-box .btn.main { height: 40px !important; font-size: 15px !important; }

  /* ---------- 微信后台骨架（面包屑 / 大标题 / 侧栏品牌 / 账号 / 表头文字链 / 右对齐标签） ---------- */
  .wx-head { padding: 4px 2px 16px !important; }
  .wx-crumb { font-size: 12.5px !important; color: #999 !important; margin-bottom: 6px !important; }
  .wx-title { font-size: 20px !important; font-weight: 600 !important; color: #191919 !important; margin: 0 !important; }
  .wx-brand { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; font-size: 15px; font-weight: 600; color: #191919; }
  .wx-logo { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 6px; background: #07C160; color: #fff; font-size: 13px; }
  .wx-account { margin-top: auto; padding: 12px 16px; border-top: 1px solid #EDEDED; display: flex; flex-direction: column; gap: 2px; }
  .wx-account b { font-size: 13.5px; color: #333; font-weight: 500; }
  .wx-account span { font-size: 12px; color: #999; }

  /* 卡片标题：去掉绿竖条，微信是朴素标题 + 下面一条细线 */
  .panel h3 { border-left: 0 !important; padding-left: 0 !important; padding-bottom: 10px !important;
              border-bottom: 1px solid #F0F0F0 !important; margin-bottom: 14px !important; font-size: 16px !important; }
  .panel { box-shadow: none !important; }

  /* 表单：标签右对齐（微信是右对齐 + 必填红星），没填过的必填项自动加星 */
  .kv > b { text-align: right !important; padding-right: 14px !important; color: #666 !important; }
  .kv > b:empty { flex: 0 0 132px !important; }
  .kv input[required] + span::after { content: ' *'; color: #FA5151; }

  /* 表格里的操作：微信是蓝色文字链，不是灰按钮 */
  .tbl .btn, .tbl .btn.sm, .tbl .btn.ghost { background: none !important; border: 0 !important; padding: 0 8px 0 0 !important;
      height: auto !important; color: #576B95 !important; font-size: 13px !important; }
  .tbl .btn.main { color: #07C160 !important; }

  /* 页面底部：把最后一个按钮排固定成微信那种「底部操作条」 */
  .panel > .row:last-child { position: sticky; bottom: 0; background: #fff; padding: 12px 0 4px;
      border-top: 1px solid #F0F0F0; margin-top: 14px; }

  /* ---------- 排版收口 ---------- */
  #content { max-width: 1240px !important; margin: 0 auto !important; box-sizing: border-box !important; }
  .panel { padding: 18px 20px 20px !important; }
  .panel + .panel, .panel + .hint { margin-top: 14px !important; }
  .panel .tbl { display: block !important; overflow-x: auto !important; }
  .row { display: flex !important; gap: 8px !important; flex-wrap: wrap !important; align-items: center !important; }
  .panel > .row:last-child { position: static !important; }
  .kv { padding: 7px 0 !important; }
  .hint { margin: 2px 0 8px !important; }
  #nav { display: flex !important; flex-direction: column !important; overflow-y: auto !important; }
  .wx-account { flex: 0 0 auto !important; }
  .wx-ico { width: 17px !important; height: 17px !important; flex: 0 0 17px !important; opacity: .85; }
  #nav button { display: flex !important; align-items: center !important; gap: 10px !important; }
  #nav button.on .wx-ico { opacity: 1; }
  /* ---------- 微信后台的控件样式：开关 / 勾选 / 单选 / 分页 / 空状态 / 点击反馈 ---------- */
  /* 开关：微信是 44×24 的胶囊，选中绿底白圆点，带过渡 */
  .sw { display: inline-flex !important; align-items: center !important; cursor: pointer !important; vertical-align: middle !important; }
  .sw input { display: none !important; }
  .sw span { position: relative !important; width: 44px !important; height: 24px !important; border-radius: 12px !important;
             background: #D9D9D9 !important; transition: background .18s !important; display: inline-block !important; }
  .sw span::after { content: '' !important; position: absolute !important; top: 2px !important; left: 2px !important;
             width: 20px !important; height: 20px !important; border-radius: 50% !important; background: #fff !important;
             box-shadow: 0 1px 3px rgba(0,0,0,.18) !important; transition: left .18s !important; }
  .sw input:checked + span { background: #07C160 !important; }
  .sw input:checked + span::after { left: 22px !important; }
  .sw input:disabled + span { opacity: .5 !important; }

  /* 勾选框 / 单选：统一微信绿 */
  input[type="checkbox"], input[type="radio"] { accent-color: #07C160 !important; width: 16px !important; height: 16px !important;
      vertical-align: -2px !important; margin-right: 6px !important; }

  /* 按钮点击反馈（微信那种轻微下沉） */
  .btn:active { transform: translateY(1px) !important; }

  /* 分页器（如果有） */
  .pager, .pagination, .pages { display: flex !important; gap: 6px !important; align-items: center !important; padding: 12px 0 !important; }
  .pager a, .pagination a, .pages a, .pager button, .pages button { min-width: 32px !important; height: 32px !important; line-height: 32px !important;
      text-align: center !important; border: 1px solid #E5E5E5 !important; border-radius: 6px !important; background: #fff !important;
      color: #333 !important; font-size: 13px !important; text-decoration: none !important; }
  .pager a.on, .pages a.on, .pager .on { background: #07C160 !important; border-color: #07C160 !important; color: #fff !important; }

  /* 空状态：居中灰字 */
  .empty, td .hint, .panel > .hint:only-child { text-align: center !important; padding: 28px 12px !important; color: #999 !important; }

  /* 列表行（左侧图标 + 右侧箭头）*/
  .listrow { display: flex !important; align-items: center !important; gap: 10px !important; height: 52px !important;
             padding: 0 4px !important; border-bottom: 1px solid #F2F2F2 !important; }
  .listrow:hover { background: #FAFAFA !important; }

  /* ---------- 内容页按微信「设置列表」重排：先看这一段 ---------- */
  .kv { display: flex !important; align-items: center !important; min-height: 44px !important;
        padding: 7px 0 !important; border-bottom: 1px solid #F2F2F2 !important; gap: 12px !important; }
  .kv:last-child { border-bottom: 0 !important; }
  .kv > b { flex: 0 0 96px !important; text-align: left !important; padding-right: 0 !important;
            color: #888 !important; font-size: 14px !important; font-weight: 400 !important; line-height: 1.5 !important; }
  .kv > b:empty { flex: 0 0 96px !important; }
  .kv > span { flex: 1 !important; display: flex !important; justify-content: flex-end !important;
               align-items: center !important; gap: 8px !important; flex-wrap: wrap !important; }
  .kv > span > .hint { text-align: left !important; width: 100% !important; }
  .kv input.wide, .kv textarea.wide { max-width: 460px !important; }
  .kv input:not(.wide) { max-width: 240px !important; }
  .kv textarea { max-width: 620px !important; }
  .panel > .hint { margin: 0 0 10px !important; padding: 0 2px !important; }
  .tbl th:first-child, .tbl td:first-child { padding-left: 16px !important; }
  .tbl th:last-child, .tbl td:last-child { padding-right: 16px !important; }

  /* ---------- 收干净：统一留白 / 行距 / 换行 / 按钮间距 ---------- */
  #content { padding: 22px 24px 40px !important; }
  .panel { padding: 18px 20px 20px !important; margin: 0 0 16px 0 !important; }
  .panel:last-child { margin-bottom: 0 !important; }
  .panel h3 { margin: 0 0 12px 0 !important; padding-bottom: 10px !important; font-size: 16px !important; }
  .panel > .hint + .kv, .panel > .kv:first-of-type { margin-top: 4px !important; }
  .kv input, .kv select, .kv textarea { font-size: 13.5px !important; }
  textarea { font-size: 12.5px !important; line-height: 1.65 !important; background: #FCFCFC !important; color: #333 !important; }
  .hint { font-size: 12.5px !important; color: #9A9A9A !important; line-height: 1.75 !important; }
  /* 表格：长内容自动换行不撑破，操作列靠右不换行 */
  .tbl td { max-width: 360px !important; overflow-wrap: anywhere !important; }
  .tbl td:last-child, .tbl th:last-child { text-align: right !important; white-space: nowrap !important; }
  /* 按钮间距统一 */
  .row { margin-top: 12px !important; }
  .row .btn + .btn, .row button + button { margin-left: 8px !important; }
  .panel table.tbl { margin: 6px 0 0 0 !important; }
  /* 输入框里的 placeholder 更浅，减少视觉噪音 */
  ::placeholder { color: #BFBFBF !important; }

  @media (max-width: 900px) {
    #nav { width: 60px !important; }
    #nav button { margin: 2px 6px !important; padding: 0 6px !important; font-size: 0 !important; }
    #nav button .n { font-size: 10px !important; }
    .wx-brand span:last-child, .wx-account span { display: none !important; }
    #content { padding: 12px !important; }
  }
</style>
<!-- 微信后台那套结构骨架：页面顶部自动加「面包屑 + 大标题」，
     侧栏顶部放产品名、底部放当前账号。纯注入，不改各页面自己的渲染逻辑。 -->
<script>
(function () {
  function menuOf(key) {
    try { return (MENUS || []).find(function (m) { return m.key === key; }) || { name: '', group: '' }; }
    catch (e) { return { name: '', group: '' }; }
  }
  function crumbFor(name, group) {
    var parts = ['首页'];
    if (group) parts.push(group);
    if (name) parts.push(name);
    return parts.join('  /  ');
  }
  function applyHeader() {
    var c = document.getElementById('content');
    if (!c) return;
    var key = (typeof PAGE !== 'undefined') ? PAGE : '';
    var m = menuOf(key);
    var html = '<div class="wx-head">'
      + '<div class="wx-crumb">' + crumbFor(m.name, m.group) + '</div>'
      + '<h2 class="wx-title">' + (m.name || '') + '</h2>'
      + '</div>';
    var exist = c.querySelector('.wx-head');
    if (!exist) { c.insertAdjacentHTML('afterbegin', html); return; }
    if (exist.getAttribute('data-key') !== key || exist.getAttribute('data-t') !== (m.name)) {
      exist.outerHTML = html.replace('class="wx-head"', 'class="wx-head" data-key="' + key + '" data-t="' + m.name + '"');
    }
  }
  function applySidebar() {
    var nav = document.getElementById('nav');
    if (!nav) return;
    /* 把 emoji 菜单图标换成统一的线性图标（微信后台就是一套线性图标，emoji 一眼假） */
    var ICONS = {
      dashboard: '<path d="M3 12h4l3 8 4-16 3 8h4"/>',
      users: '<circle cx="12" cy="8" r="3.2"/><path d="M4.5 20c.6-3.6 3.7-5.5 7.5-5.5s6.9 1.9 7.5 5.5"/>',
      messages: '<path d="M4 5h16v11H8l-4 4z"/>',
      support: '<path d="M4 13v-1a8 8 0 0 1 16 0v1"/><rect x="3" y="13" width="4" height="6" rx="1.4"/><rect x="17" y="13" width="4" height="6" rx="1.4"/>',
      friends: '<circle cx="9" cy="9" r="3.2"/><path d="M2.5 19c.5-3 3-4.6 6.5-4.6S15 16 15.5 19"/><path d="M17 8.5a2.6 2.6 0 1 1 0 5.2"/><path d="M16 14.6c2.7.3 4.4 1.8 4.8 4.4"/>',
      groups: '<circle cx="8" cy="9" r="2.6"/><circle cx="16" cy="9" r="2.6"/><path d="M3 19c.4-2.7 2.4-4.3 5-4.3M13 19c.4-2.7 2.4-4.3 5-4.3"/>',
      icons: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><circle cx="17" cy="17" r="3.4"/>',
      discover: '<circle cx="12" cy="12" r="8.5"/><path d="M15.2 8.8l-2 5.4-5.4 2 2-5.4z"/>',
      feed: '<rect x="3" y="5" width="18" height="14" rx="2.4"/><path d="M9.5 9.5l5 2.5-5 2.5z"/>',
      mepage: '<circle cx="12" cy="8.5" r="3.4"/><path d="M5 20c.7-3.6 3.6-5.4 7-5.4s6.3 1.8 7 5.4"/>',
      service: '<rect x="4" y="4" width="16" height="16" rx="2.4"/><path d="M8 9h8M8 13h8M8 17h4"/>',
      wallet: '<rect x="3" y="6" width="18" height="12" rx="2.4"/><path d="M16 12h3"/><path d="M3 10h18"/>',
      rpcovers: '<rect x="5" y="4" width="14" height="16" rx="2.2"/><path d="M12 9.5v5M9.5 12h5"/>',
      loginpage: '<path d="M4 6h16v12H4z"/><path d="M4 10h16"/>',
      badges: '<path d="M12 4a5 5 0 0 1 5 5v4l1.5 3H5.5L7 13V9a5 5 0 0 1 5-5z"/><path d="M10.5 19a1.5 1.5 0 0 0 3 0"/>',
      sms: '<rect x="7" y="3" width="10" height="18" rx="2.2"/><path d="M11 6.5h2"/>',
      push: '<path d="M6 16V9a6 6 0 1 1 12 0v7"/>',
      ops: '<circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
      audit: '<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/>',
      admins: '<circle cx="12" cy="9" r="3.2"/><path d="M5.5 19c.6-3.2 3.3-4.8 6.5-4.8s5.9 1.6 6.5 4.8"/>',
      risk: '<path d="M12 3l8 3.5v5c0 4.4-3.2 7.6-8 9.5-4.8-1.9-8-5.1-8-9.5v-5z"/>',
      reports: '<path d="M5 3v18"/><path d="M5 4.5h12l-2.2 4 2.2 4H5z"/>',
      moments: '<rect x="3.5" y="4.5" width="17" height="15" rx="2.4"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-2.5 4 3.5"/>',
      payments: '<rect x="3" y="5" width="18" height="14" rx="2.4"/><path d="M3 10h18M7 15h3"/>',
      feedback: '<path d="M4 5h16v11H9l-5 4z"/>',
      groups2: '<circle cx="12" cy="8" r="3"/><circle cx="6" cy="16" r="2.4"/><circle cx="18" cy="16" r="2.4"/><path d="M9 9.6l-1.6 4M15 9.6l1.6 4"/>',
      biz: '<path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16v11H4z"/><path d="M9 20v-6h6v6"/>'
    };
    nav.querySelectorAll('button').forEach(function (btn) {
      if (btn.getAttribute('data-wxicon') === '1') return;
      var key = btn.getAttribute('data-page') || '';
      var body = ICONS[key] || '<circle cx="12" cy="12" r="7"/>';
      var svg = '<svg class="wx-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"'
        + ' stroke-linecap="round" stroke-linejoin="round">' + body + '</svg>';
      var t = btn.firstChild;
      if (t && t.nodeType === 3) t.textContent = t.textContent.replace(/^[^\u4e00-\u9fa5A-Za-z0-9]+\s*/, '').replace(/^\s+/, ' ');
      btn.insertAdjacentHTML('afterbegin', svg);
      btn.setAttribute('data-wxicon', '1');
    });
    if (!document.querySelector('.wx-brand')) {
      nav.insertAdjacentHTML('afterbegin', '<div class="wx-brand"><span class="wx-logo">C</span><span>CHRIS 管理后台</span></div>');
    }
    var foot = document.querySelector('.wx-account');
    if (!foot) {
      var name = '', role = '';
      try { name = (ME && (ME.name || ME.username)) || ''; role = (ME && (ME.roleName || ME.role)) || ''; } catch (e) { }
      var box = document.createElement('div');
      box.className = 'wx-account';
      box.innerHTML = '<b>' + (name || 'admin') + '</b><span>' + (role || '') + '</span>';
      nav.appendChild(box);
    }
  }
  function applyAll() { applyHeader(); applySidebar(); }
  document.addEventListener('DOMContentLoaded', function () {
    var c = document.getElementById('content');
    if (c) new MutationObserver(applyAll).observe(c, { childList: true });
    applyAll();
    document.addEventListener('click', function () { setTimeout(applyAll, 60); }, true);
  });
})();
</script>
</head>
<body>

<div id="login">
  <div class="login-box">
    <div class="lg-mark">C</div>
    <h1>CHRIS 管理后台</h1>
    <p>独立管理端 · 多角色 · 全量审计</p>
    <div class="field"><label>账号</label><input id="lgUser" placeholder="admin" autocomplete="username"></div>
    <div class="field"><label>密码</label><input id="lgPass" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
    <button class="btn main block" id="lgBtn">登 录</button>
    <div class="err" id="lgErr"></div>

const STATE = {};                 // 每个页面的筛选条件

function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.classList.toggle('bad', !!bad); t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2000);
}

/* 通用色板：value 里可能有「浅色|深色」两份，两个色块分别对应它们 */
function colorSwatchHtml(attr, value, light) {
  var raw = String(value || '');
  var parts = raw.split('|');
  var v = light ? (parts[0] || '#4A90D9') : (parts[1] || parts[0] || '#4A90D9');
  v = v.trim();
  if (!/^#[0-9a-fA-F]{6}$/.test(v)) v = '#4A90D9';
  return '<input type="color" class="swatch" ' + attr + ' value="' + v + '" title="点这里选色">';
}
function colorPairHtml(dataAttr, value) {
  return '<span style="display:inline-flex;gap:4px;align-items:center;vertical-align:middle">'
    + colorSwatchHtml('data-light="' + dataAttr + '"', value, true)
    + colorSwatchHtml('data-dark="' + dataAttr + '"', value, false)
    + '</span>';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtTime(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d.getTime())) return String(s);
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' '
    + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function money(n) { return '¥' + Number(n || 0).toFixed(2); }
function badge(text, cls) { return '<span class="tag ' + (cls || 'gy') + '">' + esc(text) + '</span>'; }
/* 三个状态的颜色统一：待收款=橙 / 已收款=绿 / 已退回=灰 */
function payTag(status) {
  if (status === 'received') return badge('已收款', 'g');
  if (status === 'refunded') return badge('已退回', 'gy');
  return badge('待收款', 'o');
}
function openModal(html) { $('sheet').innerHTML = html; $('modal').classList.add('on'); }
function closeModal() { $('modal').classList.remove('on'); }
$('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

async function api(path, opts, retried) {
  const o = Object.assign({ headers: {} }, opts || {});
  if (o.body && typeof o.body !== 'string') {
    o.headers['Content-Type'] = 'application/json';
    o.body = JSON.stringify(o.body);
  }
  const r = await fetch('/api/ops' + path, o);
  let j = null;
  try { j = await r.json(); } catch (e) { j = null; }
  /* 高危操作（封号 / 撤销交易 / 解散群 / 删动态 / 提现放款…）服务端要求二次确认：
     这里弹一次密码框，输对了自动带密码重试一遍，输错就照原样报错。 */
  if (r.status === 428 && !retried && /再输入一次/.test(String((j && j.error) || ''))) {
    const pw = window.prompt((j && j.error) + '\n\n请输入你自己的后台密码（取消 = 放弃这次操作）', '');
    if (!pw) throw new Error('已取消：这类高危操作必须二次确认');
    const body = (opts && opts.body && typeof opts.body === 'object')
      ? Object.assign({}, opts.body, { confirmPassword: pw }) : { confirmPassword: pw };
    return api(path, Object.assign({}, opts, { body }), 1);
  }
  if (!j || j.ok !== true) throw new Error((j && j.error) || ('请求失败 ' + r.status));
  /* 双人复核模式：这次没真执行，等另一个管理员批准 */
  if (j.data && j.data.needSecondAdmin) {
    window.alert('已提交「双人复核」，还没有真正执行\n\n操作：' + j.data.label + '\n'
      + (j.data.hint || '') + '\n单号：' + j.data.pendingApproval);
  }
  return j.data;
}

/* 时间范围 → 起止时间戳 */
function rangeOf(key) {
  const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const day = 86400000;
  if (key === 'today') return [d0.getTime(), 0];
  if (key === '7d') return [d0.getTime() - 6 * day, 0];
  if (key === '30d') return [d0.getTime() - 29 * day, 0];
  return [0, 0];
}
function dateStart(s) { return s ? new Date(s + 'T00:00:00').getTime() : 0; }
function dateEnd(s) { return s ? new Date(s + 'T23:59:59').getTime() : 0; }

/* ---------------------------------------------------------- 登录 */

async function login() {
  $('lgErr').textContent = '';
  try {
    const d = await api('/login', { method: 'POST', body: {
      username: $('lgUser').value.trim(), password: $('lgPass').value } });
    ME = d.admin;
    start();
  } catch (e) { $('lgErr').textContent = e.message; }
}
$('lgBtn').addEventListener('click', login);
$('lgPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
$('lgUser').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('lgPass').focus(); });

/* ---------------------------------------------------------- 启动 */

function can(perm) { return ME && ME.perms && ME.perms.indexOf(perm) >= 0; }
const isSuper = () => ME && ME.role === 'super';
/* 想让浏览器弹系统通知就先点一下这个授权（不点也不影响页面里的提示和声音） */
function askNotifyPermission() {
  try {
    if (window.Notification && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  } catch (e) { }
}

/* ------------------------------------------------ 侧边栏：分组 / 搜索 / 数字气泡 */
const NAVBADGE = {};
function navItems() {
  return MENUS.filter((m) => can(m.perm) && (!m.superOnly || ME.role === 'super'));
}
function setNavBadges(map) {
  let changed = false;
  Object.keys(map).forEach((k) => {
    const v = Number(map[k]) || 0;
    if ((NAVBADGE[k] || 0) !== v) { NAVBADGE[k] = v; changed = true; }
  });
  if (!changed) return;
  $('nav').querySelectorAll('button').forEach((b) => {
    const k = b.getAttribute('data-page');
    const old = b.querySelector('.n');
    if (old) old.remove();
    const v = NAVBADGE[k] || 0;
    if (v > 0) {
      const s = document.createElement('span');
      s.className = 'n';
      s.textContent = v > 99 ? '99+' : String(v);
      b.appendChild(s);
    }
  });
}
$('navq').addEventListener('input', () => {
  const q = $('navq').value.trim().toLowerCase();
  let head = null, hitInGroup = 0;
  const closeHead = () => { if (head) head.style.display = hitInGroup ? '' : 'none'; };
  [...$('nav').children].forEach((el) => {
    if (el.classList.contains('ngroup')) { closeHead(); head = el; hitInGroup = 0; return; }
    const hit = !q || (el.textContent || '').toLowerCase().indexOf(q) >= 0;
    el.style.display = hit ? '' : 'none';
    if (hit) hitInGroup++;
  });
  closeHead();
});

/* ------------------------------------------------ 深浅色主题 */
function setTheme(dark, save) {
  document.body.classList.toggle('dark', !!dark);
  if ($('theme')) $('theme').textContent = dark ? '☀️' : '🌙';
  if (save) { try { localStorage.setItem('ops-theme', dark ? 'dark' : 'light'); } catch (e) { } }
}
$('theme').addEventListener('click', () => setTheme(!document.body.classList.contains('dark'), true));
(function () {
  let want = null;
  try { want = localStorage.getItem('ops-theme'); } catch (e) { }
  if (!want) want = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  setTheme(want === 'dark', false);
})();

/* ------------------------------------------------ 命令面板（Ctrl / ⌘ + K） */
const CMD = { on: false, idx: 0, list: [] };
function cmdSource() {
  return navItems().map((m) => ({ icon: m.icon, name: m.name, group: m.group || '', run: () => go(m.key) }))
    .concat([
      { icon: '🌓', name: '切换深色 / 浅色主题', group: '快捷', run: () => setTheme(!document.body.classList.contains('dark'), true) },
      { icon: '🔄', name: '刷新当前页面', group: '快捷', run: () => go(PAGE) },
      { icon: '🔓', name: '退出登录', group: '快捷', run: () => $('logout').click() }
    ]);
}
function renderCmd() {
  const q = $('cmdq').value.trim().toLowerCase();
  CMD.list = cmdSource().filter((x) => !q || (x.name + x.group).toLowerCase().indexOf(q) >= 0);
  if (CMD.idx >= CMD.list.length) CMD.idx = 0;
  $('cmdlist').innerHTML = CMD.list.length
    ? CMD.list.map((x, i) => '<button data-i="' + i + '" class="' + (i === CMD.idx ? 'on' : '') + '">'
      + '<span class="em">' + x.icon + '</span>' + esc(x.name)
      + (x.group ? '<span class="gp">' + esc(x.group) + '</span>' : '') + '</button>').join('')
    : '<div style="padding:22px;text-align:center;color:var(--ink3)">没有匹配的功能</div>';
  $('cmdlist').querySelectorAll('button').forEach((b) => {
    b.addEventListener('click', () => runCmd(Number(b.getAttribute('data-i'))));
  });
}
function runCmd(i) { const x = CMD.list[i]; closeCmd(); if (x) x.run(); }
function openCmd() {
  CMD.on = true; CMD.idx = 0; $('cmd').classList.add('on'); $('cmdq').value = '';
  renderCmd(); setTimeout(() => $('cmdq').focus(), 30);
}
function closeCmd() { CMD.on = false; $('cmd').classList.remove('on'); }
$('cmd').addEventListener('click', (e) => { if (e.target.id === 'cmd') closeCmd(); });
$('cmdBtn').addEventListener('click', openCmd);
$('cmdq').addEventListener('input', () => { CMD.idx = 0; renderCmd(); });
$('cmdq').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') {
    e.preventDefault(); CMD.idx = Math.min(CMD.list.length - 1, CMD.idx + 1); renderCmd();
    const b = $('cmdlist').querySelector('button.on'); if (b) b.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault(); CMD.idx = Math.max(0, CMD.idx - 1); renderCmd();
    const b = $('cmdlist').querySelector('button.on'); if (b) b.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') { e.preventDefault(); runCmd(CMD.idx); }
});
document.addEventListener('keydown', (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const typing = /INPUT|TEXTAREA|SELECT/.test(tag);
  if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'k') {
    e.preventDefault(); CMD.on ? closeCmd() : openCmd(); return;
  }
  if (CMD.on) { if (e.key === 'Escape') closeCmd(); return; }
  if (!typing && !e.ctrlKey && !e.metaKey && (e.key === 'd' || e.key === 'D')) {
    setTheme(!document.body.classList.contains('dark'), true);
  }
});

function start() {
  $('login').style.display = 'none';
  $('app').style.display = 'block';
  $('whoName').textContent = ME.name;
  $('whoRole').textContent = ME.roleName + '（' + ME.username + '）';
  $('whoAv').textContent = String(ME.name || 'C').slice(0, 1);
  $('topWho').textContent = ME.name + ' · ' + ME.roleName;
  const mine = navItems();
  let lastGroup = '';
  $('nav').innerHTML = mine.map((m) => {
    let head = '';
    if (m.group && m.group !== lastGroup) { head = '<div class="ngroup">' + esc(m.group) + '</div>'; lastGroup = m.group; }
    return head + '<button data-page="' + m.key + '" class="' + (m.key === PAGE ? 'on' : '') + '">'
      + '<span class="em">' + m.icon + '</span><span class="tx">' + m.name + '</span>'
      + (NAVBADGE[m.key] ? '<span class="n">' + (NAVBADGE[m.key] > 99 ? '99+' : NAVBADGE[m.key]) + '</span>' : '')
      + '</button>';
  }).join('');
  $('nav').querySelectorAll('button').forEach((b) => {
    b.addEventListener('click', () => go(b.getAttribute('data-page')));
  });
  if (!MENUS.some((m) => m.key === PAGE && can(m.perm))) {
    PAGE = (MENUS.find((m) => can(m.perm)) || { key: 'dashboard' }).key;
  }
  go(PAGE);
  liveTick();
}

function go(page) {
  PAGE = page;
  $('nav').querySelectorAll('button').forEach((b) => {
    b.classList.toggle('on', b.getAttribute('data-page') === page);
  });
  const m = MENUS.find((x) => x.key === page);
  $('pageTitle').textContent = m ? m.name : page;
  if ($('crumb')) $('crumb').textContent = (m && m.group ? m.group : '');
  document.title = (m ? m.name : page) + ' · CHRIS 管理后台';
  $('content').innerHTML = '<div class="empty"><div class="skel"><i class="w40"></i><i class="w80"></i><i class="w60"></i></div>加载中…</div>';
  (PAGES[page] || PAGES.dashboard)();
}

/* 每次页面内容换掉后：给顶层块加上错峰动画序号，让列表「一行一行」淡入 */
function decorate() {
  const box = $('content');
  if (!box) return;
  [...box.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 8)));
}
let _decoTimer = null;
new MutationObserver(() => {
  clearTimeout(_decoTimer);
  _decoTimer = setTimeout(() => { decorate(); animateCounters(); growBars(); }, 0);
}).observe($('content'), { childList: true });

/* 顶部实时状态：在线人数 / 每分钟消息，每 5 秒刷一次（切到后台标签页时暂停） */
const LIVE = { t: 0, hist: [], prev: {} };
async function liveTick() {
  const pill = $('livePill');
  if (!pill || !ME || document.hidden) return;
  try {
    const d = await api('/dashboard');
    const s = d.stats;
    LIVE.hist.push(Number(s.msgPerMin) || 0);
    if (LIVE.hist.length > 26) LIVE.hist.shift();
    $('liveTxt').innerHTML = '在线 <b>' + s.online + '</b> · 消息/分 <b>' + s.msgPerMin + '</b>';
    pill.classList.toggle('off', false);
    pill.classList.toggle('hot', (s.abnormal || 0) + (s.violations || 0) + (s.reports || 0) > 0);
    setNavBadges({ reports: s.reports, risk: s.violations, friends: s.pendingFriends, payments: s.abnormal, support: s.support });
    /* 客服工单提醒：后台开着的时候，来了新工单响一声 + 弹一条系统通知 */
    (function () {
      const sp = Number(s.support) || 0;
      if (LIVE.prevSupport === undefined) { LIVE.prevSupport = sp; return; }
      if (sp > LIVE.prevSupport) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            const ac = new AC();
            const o = ac.createOscillator();
            const g = ac.createGain();
            o.type = 'sine';
            o.frequency.value = 880;
            g.gain.value = 0.15;
            o.connect(g); g.connect(ac.destination);
            o.start();
            o.frequency.setValueAtTime(1180, ac.currentTime + 0.12);
            o.stop(ac.currentTime + 0.3);
          }
        } catch (e) { }
        toast('来了 ' + (sp - LIVE.prevSupport) + ' 条新客服工单');
        try {
          if (window.Notification && Notification.permission === 'granted') {
            new Notification('客服中心', { body: '来了新工单，点开后台处理' });
          }
        } catch (e) { }
      }
      LIVE.prevSupport = sp;
    })();
    LIVE.t = Date.now();
    paintSpark();
    /* 仪表盘上的大数字：把新数据灌进去，让它自己滚到新值并显示涨跌 */
    KPI_KEYS.forEach((k) => {

}

const KPI_KEYS = ['online', 'newUsersToday', 'messagesToday', 'transfersToday', 'reports', 'violations', 'abnormal'];

/* 顶栏时钟（每秒走一格，最后一格是秒） */
function tickClock() {
  const el = $('clock');
  if (!el) return;
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  const wk = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  el.textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + wk + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
tickClock();
setInterval(tickClock, 1000);

/* ---------------------------------------------------------------
   数字要会动：
   · 仪表盘大数字 0 → 真实值 滚动增长，之后每 5 秒跟着新数据再滚一次
   · 右上角小标签显示这次涨了/掉了多少
   · 环形图、进度条、柱状图都是渐变式变化，不是硬切
   --------------------------------------------------------------- */
function fmtNum(n) { return Number(n || 0).toLocaleString('en-US'); }

function animateCounters(root) {
  const box = root || $('content');
  if (!box) return;
  box.querySelectorAll('[data-cur]').forEach((el) => {
    const to = Number(el.getAttribute('data-cur')) || 0;
    const from = Number(el.getAttribute('data-shown') || 0);
    if (to === from) { el.textContent = fmtNum(to); return; }
    el.setAttribute('data-shown', String(to));
    const dur = Math.min(900, 340 + Math.abs(to - from) * 8);
    const t0 = performance.now();
    el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick');
    const step = (t) => {
      const k = Math.min(1, (t - t0) / dur);
      const v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
      el.textContent = fmtNum(v);
      if (k < 1) requestAnimationFrame(step); else el.textContent = fmtNum(to);
    };
    requestAnimationFrame(step);
  });
}

/* 涨跌小标签：和上一次取到的值比 */
function setDelta(key, v) {
  const el = document.querySelector('[data-d="' + key + '"]');
  if (!el) return;
  const prev = LIVE.prev[key];
  if (prev === undefined) { LIVE.prev[key] = v; return; }
  if (v === prev) return;
  const diff = v - prev;
  LIVE.prev[key] = v;
  const good = (key === 'online' || key === 'newUsersToday' || key === 'messagesToday' || key === 'transfersToday')
    ? diff > 0 : diff < 0;                       // 告警类减少才是好事
  el.className = 'delta ' + (good ? 'up' : 'down');
  el.textContent = (diff > 0 ? '▲ +' : '▼ ') + fmtNum(diff);
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'delta'; }, 6000);
}

/* 环形图：从 0 慢慢转到目标比例 */
function animateRing(el, to) {
  if (!el) return;
  const from = Number(el.getAttribute('data-p') || 0);
  el.setAttribute('data-p', String(to));
  const hole = el.querySelector('b');
  const t0 = performance.now(), dur = 900;
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    const v = from + (to - from) * (1 - Math.pow(1 - k, 3));
    el.style.setProperty('--p', String(Math.round(v * 10) / 10));
    if (hole) hole.textContent = (Math.round(v * 10) / 10) + '%';
    if (k < 1) requestAnimationFrame(step); else el.style.setProperty('--p', String(to));
  };
  requestAnimationFrame(step);
}

/* 进度条：先 0 宽再撑开，让它有个「长出来」的过程 */
function growBars(root) {
  const box = root || $('content');
  if (!box) return;
  box.querySelectorAll('.bp > i[data-w]').forEach((el) => {
    if (el.getAttribute('data-grown') === '1') return;
    el.setAttribute('data-grown', '1');
    const w = el.getAttribute('data-w') + '%';
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.width = w; }));
  });
}

/* 柱状图：复用同一批柱子改高度，这样 CSS 过渡才会动起来 */
function paintSpark() {
  const sp = $('spark');
  if (!sp) return;
  const hist = LIVE.hist;
  const peak = Math.max(1, ...hist);
  while (sp.children.length < hist.length) sp.appendChild(document.createElement('i'));
  while (sp.children.length > hist.length) sp.removeChild(sp.lastChild);
  [...sp.children].forEach((el, i) => {
    const v = hist[i] || 0;
    el.style.height = Math.max(2, Math.round(v / peak * 32)) + 'px';
    el.classList.toggle('hi', v >= peak * 0.75 && v > 0);
  });
}

/* ---------------- 风控引擎（多维打分 → 分级处置 → 证据留痕 / 双人复核） ---------------- */

const RISK_KIND_NAME = {
  sensitive: '命中敏感词', link: '发外链', mass_send: '群发同一内容', fast_send: '发送过快',
  fast_friend: '加好友过快', report: '被举报', login_new_device: '新设备登录',
  same_ip_multi: '同 IP 多账号', signup_burst: '同 IP 批量注册'
};
function riskLevelBadge(lv) {
  if (lv === '高危') return badge(lv, 'r');
  if (lv === '受限') return badge(lv, 'o');
  if (lv === '关注') return badge(lv, 'gy');
  return badge(lv || '正常', 'g');
}
function riskSignals(kinds) {
  const keys = Object.keys(kinds || {});
  if (!keys.length) return '<span class="hint">—</span>';
  return keys.map((k) => badge((RISK_KIND_NAME[k] || k) + '×' + kinds[k], 'gy')).join(' ');
}

    + '</div></div></div>'
    + '<div class="panel"><h3>转账流水</h3><table>'
    + '<tr><th>时间</th><th>付款人</th><th>收款人</th><th>金额</th><th>方式</th><th>状态</th><th>说明</th><th></th></tr>'

    };
    PAGES.payments();
  };
  $('pFind').addEventListener('click', read);
  $('pr').addEventListener('change', read);
  $('pq').addEventListener('keydown', (e) => { if (e.key === 'Enter') read(); });
  $('pClear').addEventListener('click', () => { STATE.payments = { q: '', status: '', range: 'all', d1: '', d2: '', min: '', max: '' }; PAGES.payments(); });
  $('content').querySelectorAll('[data-pay]').forEach((tr) => {
    tr.addEventListener('click', (e) => {
      if (e.target.closest('[data-rev]')) return;
      showTransfer(tr.getAttribute('data-pay'));
    });
  });
  $('content').querySelectorAll('[data-rev]').forEach((b) => {
    b.addEventListener('click', async (e) => {
      e.stopPropagation();
      const reason = prompt('撤销原因（会记进审计日志，钱会退回付款方零钱）', '风控撤销') || '';
      if (reason === null) return;
      try {
        await api('/payments/' + b.getAttribute('data-rev') + '/revoke', { method: 'POST', body: { reason } });
        toast('已撤销并退回');
        PAGES.payments();
      } catch (err) { toast(err.message); }
    });
  });
};

async function showTransfer(id) {

    const d = await api('/payments/' + id);
    const t = d.transfer;
    const who = (u) => u ? esc(u.nickname) + ' <span class="hint">' + esc(u.username)
      + (u.phone ? ' · ' + esc(u.phone) : '') + '</span>' + (u.banned ? ' ' + badge('已冻结', 'r') : '') : '—';
    openModal(
      '<h3>交易详情 <span class="hint">' + esc(t.id) + '</span></h3>'
      + '<div class="kv"><b>金额</b><span>' + money(t.amount) + '</span></div>'
      + '<div class="kv"><b>状态</b><span>' + payTag(t.status) + '</span></div>'
      + '<div class="kv"><b>付款人</b><span>' + who(d.payer) + '</span></div>'
      + '<div class="kv"><b>收款人</b><span>' + who(d.payee) + '</span></div>'
      + '<div class="kv"><b>付款方式</b><span>' + (t.method === 'card' ? '建设银行储蓄卡(2125)' : '零钱') + '</span></div>'
      + '<div class="kv"><b>转账说明</b><span>' + esc(t.note || '—') + '</span></div>'
      + '<div class="kv"><b>发起时间</b><span>' + fmtTime(t.createdAt) + '</span></div>'
      + '<div class="kv"><b>收款时限</b><span>' + (t.status === 'pending' ? fmtTime(new Date(t.expiresAt).toISOString()) + ' 前' : '—') + '</span></div>'
      + '<div class="kv"><b>收款时间</b><span>' + (t.receivedAt ? fmtTime(t.receivedAt) : '—') + '</span></div>'
      + '<div class="kv"><b>退回时间</b><span>' + (t.refundedAt ? fmtTime(t.refundedAt) : '—') + '</span></div>'
      + '<div class="kv"><b>所属会话</b><span>' + esc(t.chatTitle || '—') + '</span></div>'
      + '<h4>发起设备 / IP（付款方最近登录）</h4>'
      + (d.logins.length ? d.logins.map((l) => '<div class="kv"><b>' + fmtTime(l.time)
        + '</b><span>' + esc(l.ip) + ' · ' + esc(l.device) + '</span></div>').join('')
        : '<div class="hint">没有登录记录</div>')
      + '<h4>相关操作审计</h4>'
      + (d.related.length ? d.related.map((a) => '<div class="kv"><b>' + fmtTime(a.at)
        + '</b><span>' + esc(a.name) + '（' + esc(a.role) + '）' + esc(a.action) + ' · ' + esc(a.ip)
        + ' · ' + esc(a.detail) + '</span></div>').join('')
        : '<div class="hint">这笔交易还没有后台操作记录</div>')
      + '<div class="row" style="margin-top:18px">'
      + (isSuper() && t.status === 'pending'
        ? '<button class="btn red" id="dRevoke">撤销这笔交易（退回付款方）</button>' : '')
      + (isSuper() && d.payer
        ? '<button class="btn ' + (d.payer.banned ? 'main' : 'ghost') + '" id="dFreezePayer">'
          + (d.payer.banned ? '解冻付款人' : '冻结付款人') + '</button>' : '')
      + (isSuper() && d.payee
        ? '<button class="btn ' + (d.payee.banned ? 'main' : 'ghost') + '" id="dFreezePayee">'
          + (d.payee.banned ? '解冻收款人' : '冻结收款人') + '</button>' : '')
      + '<button class="btn" id="dClose">关闭</button></div>'
      + (isSuper() ? '' : '<div class="hint" style="margin-top:8px">撤销交易 / 冻结账号 只有超级管理员能用</div>')
    );
    $('dClose').addEventListener('click', closeModal);
    const rev = $('dRevoke');
    if (rev) rev.addEventListener('click', async () => {
      const reason = prompt('撤销原因', '风控撤销');
      if (reason === null) return;
      try {
        await api('/payments/' + id + '/revoke', { method: 'POST', body: { reason } });
        toast('已撤销并退回');
        closeModal(); PAGES.payments();
      } catch (e) { toast(e.message); }
    });
    const fr = (btn, user) => {
      if (!btn || !user) return;
      btn.addEventListener('click', async () => {
        const frozen = !user.banned;
        const reason = frozen ? (prompt('冻结原因', '支付风控冻结') || '支付风控冻结') : '';
        try {
          await api('/payments/freeze', { method: 'POST', body: { userId: user.id, frozen, reason } });
          toast(frozen ? '已冻结' : '已解冻');
          closeModal(); PAGES.payments();
        } catch (e) { toast(e.message); }
      });
    };
    fr($('dFreezePayer'), d.payer);
    fr($('dFreezePayee'), d.payee);
  } catch (e) { toast(e.message); }
}

];

/* ============================================================ 发现页
   后台可以自由加行、删行、改名、换图标、改颜色、调顺序、开关；
   保存后网页版和 App 都会跟着变（App 下次打开或切到发现页时拉新配置）。 */
/* ============================================================ 视频号
   后台管控：① 内置视频列表（增删改、排序、基础赞数）
            ② 样式（头像/字号/动作栏尺寸/底部留白）
            ③ 开关（前台能不能发、能不能剪水印、显示动作栏、自动播放）
   用户自己发的作品在最下面，后台可以直接删。 */
PAGES.feed = async () => {
  const d = await api('/feed');
  const writable = can('icons.write');
  let items = (d.items || []).map((x) => Object.assign({}, x));
  let style = Object.assign({}, d.defaults ? d.defaults.style : {}, d.style || {});
  let flags = Object.assign({}, d.defaults ? d.defaults.flags : {}, d.flags || {});

  const fields = [
    ['video', '视频地址（/uploads/xxx.mp4 或直链）', '30%'],
    ['cover', '封面（可空）', '16%'],
    ['desc', '文案', '22%'],
    ['music', '音乐名', '12%'],
    ['author', '作者', '10%'],
    ['tag', '标签', '7%']
  ];
  const draws = () => {
    const rowOf = (it, i) => '<tr>' +
      fields.map(([k, , w]) => '<td><input data-f="' + k + '" data-i="' + i + '" style="width:100%" value="'
        + esc(it[k] == null ? '' : it[k]) + '"' + (writable ? '' : ' disabled') + '></td>').join('') +
      '<td><input data-f="baseLikes" data-i="' + i + '" style="width:64px" value="' + (it.baseLikes || 0) + '"' + (writable ? '' : ' disabled') + '></td>' +
      '<td class="row" style="gap:4px">' +
      (writable ? '<button class="btn sm" data-up="' + i + '">↑</button><button class="btn sm" data-down="' + i + '">↓</button>'
        + '<button class="btn sm ghost" data-del="' + i + '">删</button>' : '') + '</td></tr>';
    const stat = (k, label, def) => '<div class="row" style="margin:8px 0"><span class="field-label" style="width:170px">'
      + label + '</span><input data-s="' + k + '" style="width:110px" value="' + (style[k] == null ? def : style[k]) + '"'
      + (writable ? '' : ' disabled') + '></div>';
    const flag = (k, label) => '<label class="row" style="margin:8px 0;gap:8px"><input type="checkbox" data-fl="' + k + '"'
      + (flags[k] ? ' checked' : '') + (writable ? '' : ' disabled') + '><span>' + label + '</span></label>';
    $('content').innerHTML =
      '<div class="panel"><h3>内置视频 <span class="sp"></span><span class="hint">' + items.length + ' 条</span></h3>'
      + '<div class="body"><div class="scroll-x"><table class="tbl"><tr><th>视频</th><th>封面</th><th>文案</th><th>音乐</th><th>作者</th><th>标签</th><th>基础赞</th><th></th></tr>'
      + items.map(rowOf).join('') + '</table></div>'
      + '<div class="row" style="margin-top:10px">'
      + (writable ? '<button class="btn" id="fdAdd">＋ 加一条</button>' : '') + '</div></div></div>'

      + '<div class="panel"><h3>样式</h3><div class="body">'
      + stat('avatar', '右侧头像大小', 46) + stat('nameSize', '作者名字号', 16)
      + stat('descSize', '文案字号', 14) + stat('musicSize', '音乐字号', 12.5)
      + stat('railIcon', '动作图标大小', 27) + stat('railGap', '动作栏间距', 20)
      + stat('padBottom', '底部留白', 28)
      + '<div class="hint">数字留空 = 用默认值。改完点最下面「保存」。</div></div></div>'

      + '<div class="panel"><h3>开关</h3><div class="body">'
      + flag('allowPublish', '允许前台用户自己发视频')
      + flag('allowTrim', '发布时允许「剪掉水印」')
      + flag('showRail', '显示右侧动作栏（赞 / 评论 / 分享）')
      + flag('autoPlay', '进去自动播放当前这条')
      + '</div></div>'

      + '<div class="panel"><h3>用户作品 <span class="sp"></span><span class="hint">' + (d.posts || []).length + ' 条</span></h3><div class="body">'
      + ((d.posts || []).length
        ? '<table class="tbl"><tr><th>文案</th><th>视频</th><th>时间</th><th></th></tr>'
          + (d.posts || []).map((p) => '<tr><td>' + esc((p.desc || '').slice(0, 40)) + '</td><td>' + esc(p.video || '') + '</td>'
            + '<td>' + esc((p.createdAt || '').slice(0, 16).replace('T', ' ')) + '</td>'
            + '<td>' + (writable ? '<button class="btn sm ghost" data-delpost="' + esc(p.id) + '">删</button>' : '') + '</td></tr>').join('')
          + '</table>'
        : '<div class="hint">还没有用户发过视频</div>')
      + '</div></div>'

      + '<div class="row" style="margin:14px 0">' + (writable ? '<button class="btn main" id="fdSave">保存</button>' : '') + '</div>';

    if (!writable) return;
    $('content').querySelectorAll('input[data-f]').forEach((el) => {
      el.addEventListener('input', () => {
        const i = Number(el.getAttribute('data-i'));
        const k = el.getAttribute('data-f');
        items[i][k] = (k === 'baseLikes') ? Number(el.value) || 0 : el.value;
      });
    });
    $('content').querySelectorAll('input[data-s]').forEach((el) => {
      el.addEventListener('input', () => { style[el.getAttribute('data-s')] = el.value; });
    });
    $('content').querySelectorAll('input[data-fl]').forEach((el) => {
      el.addEventListener('change', () => { flags[el.getAttribute('data-fl')] = el.checked; });
    });
    $('content').querySelectorAll('[data-up]').forEach((b) => b.addEventListener('click', () => {
      const i = Number(b.getAttribute('data-up'));
      if (i > 0) { const t = items[i - 1]; items[i - 1] = items[i]; items[i] = t; collect(); draws(); }
    }));
    $('content').querySelectorAll('[data-down]').forEach((b) => b.addEventListener('click', () => {
      const i = Number(b.getAttribute('data-down'));
      if (i < items.length - 1) { const t = items[i + 1]; items[i + 1] = items[i]; items[i] = t; collect(); draws(); }
    }));
    $('content').querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => {
      const i = Number(b.getAttribute('data-del'));
      if (!confirm('删掉「' + (items[i].desc || '') + '」？')) return;
      collect(); items.splice(i, 1); draws();
    }));
    $('content').querySelectorAll('[data-delpost]').forEach((b) => b.addEventListener('click', async () => {
      if (!confirm('删掉这条用户作品？')) return;
      try { await api('/feed/posts/' + b.getAttribute('data-delpost'), { method: 'DELETE' }); toast('已删'); PAGES.feed(); }
      catch (e) { toast(e.message); }
    }));
    if ($('fdAdd')) $('fdAdd').addEventListener('click', () => {
      collect();
      items.push({ id: 'v' + (items.length + 1), video: '', cover: '', desc: '新视频', music: '', author: '官方', tag: '', baseLikes: 0 });
      draws();
    });
    if ($('fdSave')) $('fdSave').addEventListener('click', async () => {
      collect();
      try {
        await api('/feed', { method: 'POST', body: { items: items, style: style, flags: flags } });
        toast('已保存，前台马上生效');
        PAGES.feed();
      } catch (e) { toast(e.message); }
    });
  };
  /* 把输入框里的值收回内存（换行/排序前先收一次） */
  const collect = () => {
    $('content').querySelectorAll('input[data-f]').forEach((el) => {
      const i = Number(el.getAttribute('data-i'));
      const k = el.getAttribute('data-f');
      if (items[i]) items[i][k] = (k === 'baseLikes') ? Number(el.value) || 0 : el.value;
    });
  };
  draws();
};

        ? '<div class="row" style="margin-top:12px"><button class="btn" id="dAdd">＋ 加一行</button>'
          + '<button class="btn ghost" id="dReset">恢复默认</button>'
          + '<button class="btn" id="dSave">保存并推送</button></div>'
        : '')
      + '</div></div>';

    if (!writable) return;
    $('content').querySelectorAll('input[data-f],select[data-f]').forEach((el) => {
      el.addEventListener('change', () => {
        const i = Number(el.getAttribute('data-i'));
        const f = el.getAttribute('data-f');
        items[i][f] = f === 'enabled' ? el.checked : el.value;
        if (f === 'icon') draw();
        saveSoon('已保存，前端马上生效');     // 改任何一格都自动保存
      });
    });
    /* 色板：点色块选完色 → 写回这一行的颜色输入框 → 自动保存 */
    [['data-light', 0], ['data-dark', 1]].forEach(([attr, pos]) => {
      $('content').querySelectorAll('input[' + attr + ']').forEach((el) => {
        el.addEventListener('input', () => {
          const key = el.getAttribute(attr);
          const box = key.indexOf('row') === 0
            ? $('content').querySelector('input[data-f="color"][data-i="' + key.slice(3) + '"]')
            : $('content').querySelector('input[data-k="' + key + '"]');
          if (!box) return;
          const parts = String(box.value || '').split('|');
          parts[pos < parts.length ? pos : 0] = el.value;      // 浅色改第一份，深色改第二份
          if (pos === 1 && parts.length === 1) parts[0] = el.value;
          box.value = parts.join('|');
          box.dispatchEvent(new Event('change', { bubbles: true }));
        });
      });
    });
    $('content').querySelectorAll('[data-up]').forEach((b) => b.addEventListener('click', () => {
      const i = Number(b.getAttribute('data-up'));
      if (i <= 0) return;
      const t = items[i - 1]; items[i - 1] = items[i]; items[i] = t; draw(); save('顺序已保存');
    }));
    $('content').querySelectorAll('[data-down]').forEach((b) => b.addEventListener('click', () => {
      const i = Number(b.getAttribute('data-down'));
      if (i >= items.length - 1) return;
      const t = items[i + 1]; items[i + 1] = items[i]; items[i] = t; draw(); save('顺序已保存');
    }));
    $('content').querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => {
      const i = Number(b.getAttribute('data-del'));
      if (!confirm('删掉「' + (items[i].label || '') + '」这一行？')) return;
      items.splice(i, 1); draw(); save('已删掉这一行');
    }));
    $('dAdd').addEventListener('click', () => {
      const last = items[items.length - 1] || { group: 1 };
      items.push({
        id: 'd' + Date.now().toString(36),
        label: '新入口', icon: '', color: '#4A90D9', action: 'soon',
        group: (last.group || 1) + 1, enabled: true, svg: ''
      });
      draw(); save('已加一行，去前台看看');
    });
    $('dReset').addEventListener('click', () => {
      if (!confirm('恢复成微信默认的那几行？（当前改动会丢）')) return;
      items = (d.defaults || []).map((x) => Object.assign({}, x));
      draw(); save('已恢复默认');
    });
    $('dSave').addEventListener('click', async () => {
      try {
        await api('/discover', { method: 'POST', body: { items } });
        toast('已保存，网页版和 App 马上生效');
      } catch (e) { toast(e.message); }
    });
  };
  draw();
};

};

PAGES.autoreply = async () => {

    + '<td><select data-f="match"' + dis + '><option value="contains"' + (r.match === 'exact' ? '' : ' selected') + '>包含就算</option>'
    + '<option value="exact"' + (r.match === 'exact' ? ' selected' : '') + '>完全相同</option></select></td>'
    + '<td><textarea class="wide" rows="2" data-f="reply" placeholder="自动回的文案"' + dis + '>' + esc(r.reply) + '</textarea></td>'
    + '<td><label class="sw"><input type="checkbox" data-f="enabled"' + (r.enabled === false ? '' : ' checked') + dis + '><span></span></label></td>'
    + '<td>' + (writable ? '<button class="btn sm ghost" data-del="' + i + '">删</button>' : '') + '</td></tr>').join('')
    || '<tr><td colspan="5" class="hint">还没有规则。加一条试试：关键词「红包」→「红包在聊天框右边＋号里，点红包填金额就能发」</td></tr>';
  $('content').innerHTML =

    + '<div class="hint">用户发的话里命中关键词，就用你写好的文案自动回（比 AI 更稳、说得更准）；没命中才轮到 AI 按客服知识库答。'
    + '<br>只对「在线客服」会话生效，配好再打开总开关。</div>'
    + '<div class="kv"><b>总开关</b><span><label class="sw"><input type="checkbox" id="arOn"' + (A.enabled ? ' checked' : '') + dis + '><span></span></label> '

    + '<div class="row" style="margin-top:12px"><button class="btn main" id="arSave">' + (writable ? '保存' : '你没有权限保存') + '</button>'

      });

      await api('/autoreply', { method: 'POST', body: { autoreply: { enabled: $('arOn').checked ? 1 : 0, fallback: $('arFallback').value, rules: list } } });
      toast('已保存');
      PAGES.autoreply();
    } catch (e) { toast(e.message); }
  });
  if ($('arReload')) $('arReload').addEventListener('click', () => PAGES.autoreply());
  if ($('arAdd')) $('arAdd').addEventListener('click', async () => {
    const list = [];
    $('content').querySelectorAll('[data-rule]').forEach((tr) => list.push({
      id: tr.getAttribute('data-id'),

      reply: tr.querySelector('[data-f="reply"]').value.trim(),
      enabled: tr.querySelector('[data-f="enabled"]').checked
    }));
    list.push({ id: '', keyword: '', match: 'contains', reply: '', enabled: true });

      await api('/autoreply', { method: 'POST', body: { autoreply: { enabled: $('arOn').checked ? 1 : 0, fallback: $('arFallback').value, rules: list } } });

let RPC = null;

function rpcCollect() {
  if (!RPC) return;
  const box = $('content');
  RPC.covers = [];
  box.querySelectorAll('[data-cv]').forEach((el) => {
    const img = el.querySelector('[data-f="image"]').value.trim();
    if (!img) return;
    RPC.covers.push({
      id: el.getAttribute('data-cv'),
      name: el.querySelector('[data-f="name"]').value.trim() || '红包封面',
      image: img,
      thumb: el.querySelector('[data-f="thumb"]').value.trim() || img,
      color: el.querySelector('[data-f="color"]').value.trim() || '#B3241C',
      enabled: el.querySelector('[data-f="enabled"]').checked
    });
  });
  const def = box.querySelector('[data-def]:checked');
  if (def) RPC.defaultId = def.getAttribute('data-def');
}

function drawRpc() {
  const writable = can('icons.write');
  const dis = writable ? '' : ' disabled';
  const cards = (RPC.covers || []).map((c, i) =>
    '<div class="panel" data-cv="' + esc(c.id) + '" style="margin-top:12px;display:flex;gap:12px;align-items:flex-start">'
    + '<img src="' + esc(c.image) + '" alt="" style="width:96px;height:128px;object-fit:cover;border-radius:8px;flex:0 0 96px">'
    + '<div style="flex:1;min-width:0">'
    + '<div class="kv"><b>名字</b><span><input class="wide" data-f="name" value="' + esc(c.name) + '"' + dis + '>'
    + ' <input style="width:100px" data-f="color" value="' + esc(c.color) + '" placeholder="#B3241C"' + dis + '></span></div>'
    + '<div class="kv"><b>封面图</b><span><input class="wide" data-f="image" value="' + esc(c.image) + '" placeholder="/uploads/xxx.png 或网址"' + dis + '></span></div>'
    + '<div class="kv"><b>缩略图</b><span><input class="wide" data-f="thumb" value="' + esc(c.thumb || '') + '" placeholder="留空就用封面图"' + dis + '></span></div>'
    + '<div class="kv"><b>选项</b><span><label class="sw"><input type="checkbox" data-f="enabled"' + (c.enabled ? ' checked' : '') + dis + '><span></span></label> 启用'
    + ' &nbsp;<label style="margin-left:10px"><input type="radio" name="cvdef" data-def="' + esc(c.id) + '"' + (RPC.defaultId === c.id ? ' checked' : '') + dis + '> 默认封面</label>'
    + (writable ? ' &nbsp;<button class="btn sm ghost" data-delcv="' + i + '">删掉</button>' : '')
    + (writable ? ' &nbsp;<label class="btn sm ghost" style="cursor:pointer">上传图<input type="file" accept="image/*" data-up="' + i + '" style="display:none"></label>' : '')
    + '</span></div></div></div>').join('');
  $('content').innerHTML =
    '<div class="panel"><h3>红包封面</h3>'
    + '<div class="hint">用户在「发红包」页能左右滑着挑封面 —— 这里配的就是那些封面。'
    + '封面图建议 900×1200（竖版 3:4），缩略图 300×400；主题色是图加载不出来时的底色。</div>'
    + '<div class="row" style="margin-top:14px"><button class="btn main" id="rpcSave">' + (writable ? '保存' : '你没有权限保存') + '</button>'
    + '<button class="btn" id="rpcReload" style="margin-left:8px">刷新</button>'
    + (writable ? '<button class="btn" id="rpcAdd" style="margin-left:8px">＋ 加一张封面</button>' : '')
    + '</div></div>'
    + (cards || '<div class="panel"><div class="hint">还没有封面，点「＋ 加一张封面」加一张。</div></div>');
  if ($('rpcSave')) $('rpcSave').addEventListener('click', async () => {
    rpcCollect();
    try {
      await api('/rpcovers', { method: 'POST', body: { covers: RPC } });
      toast('已保存（App 里立刻生效）');
    } catch (e) { toast(e.message); }
  });
  if ($('rpcReload')) $('rpcReload').addEventListener('click', () => { RPC = null; PAGES.rpcovers(); });
  if ($('rpcAdd')) $('rpcAdd').addEventListener('click', () => {
    rpcCollect();
    RPC.covers = (RPC.covers || []).concat([{ id: 'cv' + Date.now().toString().slice(-6), name: '新封面', image: '', thumb: '', color: '#B3241C', enabled: true }]);
    drawRpc();
  });
  $('content').querySelectorAll('[data-delcv]').forEach((b) => b.addEventListener('click', () => {
    rpcCollect();
    if (!confirm('删掉这张封面？')) return;
    RPC.covers.splice(Number(b.getAttribute('data-delcv')), 1);
    drawRpc();
  }));
  $('content').querySelectorAll('[data-up]').forEach((inp) => inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const i = Number(inp.getAttribute('data-up'));
    const fr = new FileReader();
    fr.onload = async () => {
      try {
        const r = await api('/upload', { method: 'POST', body: { name: f.name, data: String(fr.result).split(',')[1] } });
        rpcCollect();
        RPC.covers[i].image = r.url;
        if (!RPC.covers[i].thumb) RPC.covers[i].thumb = r.url;
        drawRpc();
        toast('图已上传，记得点保存');
      } catch (e) { toast(e.message); }
    };
    fr.readAsDataURL(f);
  }));
}

PAGES.rpcovers = async () => {
  const d = await api('/rpcovers');
  RPC = Object.assign({}, d.covers || {});
  drawRpc();
};

/* ---------------- 客服中心（腾讯/微信那套：常见问题 + 在线客服 + 工单） ----------------
   App 里「设置 → 帮助与反馈 → 客服中心」看到的就是这里配的东西：
   · 常见问题：分类 + 问答（App 里能搜、能点开看答案）
   · 在线客服：转人工就是和「在线客服」这个账号开一个会话，你在这里回，用户在聊天里收
   · 工单：用户提交的问题，在这里回复（会同时发进聊天）+ 结单
   ------------------------------------------------------------------ */
let SUP = null;

/* 把页面上正在编辑的内容收回内存（加/删一条之前先调用，免得丢掉没保存的改动） */
function supCollect() {
  if (!SUP) return;
  const box = $('content');
  ['title', 'searchHint', 'phone', 'email', 'workTime', 'greet', 'ticketHint'].forEach((k) => {
    const el = box.querySelector('[data-s="' + k + '"]');
    if (el) SUP[k] = el.value;
  });
  ['human', 'autoReply', 'ticketOn'].forEach((k) => {
    const el = box.querySelector('[data-s="' + k + '"]');
    if (el) SUP[k] = el.checked ? 1 : 0;
  });
  const cats = [];
  box.querySelectorAll('[data-cat]').forEach((catEl) => {
    const items = [];
    catEl.querySelectorAll('[data-item]').forEach((itEl) => {
      items.push({
        q: itEl.querySelector('[data-q]').value,
        a: itEl.querySelector('[data-a]').value
      });
    });
    cats.push({
      id: catEl.getAttribute('data-cat'),
      title: catEl.querySelector('[data-cat-title]').value,
      icon: catEl.querySelector('[data-cat-icon]').value,
      items: items
    });
  });
  if (cats.length) SUP.categories = cats;
}

function supRows() {
  const list = SUP._tickets || [];
  if (!list.length) return '<tr><td colspan="7" class="hint">还没有用户提交问题</td></tr>';
  return list.map((t) => {
    const st = t.status === 'done' ? '<span class="hint">已结单</span>'
      : (t.status === 'replied' ? '已回复' : '<b style="color:#ffb020">待处理</b>');
    return '<tr><td>' + esc(String(t.createdAt || '').slice(5, 16)) + '</td>'
      + '<td>' + esc(t.nickname || t.username || t.userId) + (t.online ? ' <span class="hint">在线</span>' : '') + '</td>'
      + '<td>' + esc(t.category || '') + '</td>'
      + '<td style="max-width:360px">' + esc(t.content || '') + '</td>'
      + '<td>' + st + '</td>'
      + '<td style="max-width:260px">' + esc(t.reply || '') + '</td>'
      + '<td><button class="btn sm" data-reply="' + t.id + '">回复</button>'
      + (t.status === 'done'
        ? ' <button class="btn sm ghost" data-reopen="' + t.id + '">重新打开</button>'
        : ' <button class="btn sm ghost" data-close="' + t.id + '">结单</button>')
      + '</td></tr>';
  }).join('');
}

    ['labelColor', '文字颜色', '#191919|#F2F2F7'],
    ['nameColor', '名字颜色', '#1C1C1E|#F2F2F7'],
    ['previewColor', '消息预览颜色', '#B2B2B2|#B2B2B2'],
    ['timeColor', '时间颜色', '#C7C7CC|#C7C7CC'],
    ['chatTimeBg', '聊天时间底色', '#E5E5E5|#2C2C2E'],
    ['chatTimeColor', '聊天时间文字色', '#8A8A8E|#8A8A8E'],
    ['chatBarIcon', '聊天底部按钮颜色', '#6F6F6F|#9A9A9A'],
    ['lineColor', '分割线颜色', '#E5E5E5|#333335'],
    ['greenColor', '微信绿（按钮/气泡）', '#07C160|#3EB575']
    ,
    ['chatRowBg', '会话行底色（未置顶）', '#FFFFFF|#2A2A2A'],
    ['pinnedBg', '置顶会话底色', '#F2F2F2|#333335'],
    ['searchIcon2', '大搜索框图标/提示色', '#8C8C8C|#9A9A9E'],
    ['subLabelColor', '次要文字颜色', '#999999|#8F8F8F'],
    ['navLineColor', '导航栏下分割线', '#E8E8E8|#2C2C2E'],
    ['redColor', '红点/警示色', '#FA5151|#FA5151'],
    ['orangeColor', '橙色/提示色', '#FF9500|#FF9500'],
    ['tabSelColor', '底部导航选中色', '#1A1A1A|#EDEDED'],
    ['tabUnselColor', '底部导航未选中色', '#6B6B6B|#8E8E93'],
    ['tabInkColor', '底部导航文字色', '#191919|#B5B5B5']
  ];
  /* 纯文字项：四个首页顶栏的标题（留空 = 用默认） */
  const TEXT_FIELDS = [
    ['tabTitle0', '顶栏文字（微信页）', '微信'],
    ['tabTitle1', '顶栏文字（通讯录）', '通讯录'],
    ['tabTitle2', '顶栏文字（发现页）', '发现'],
    ['tabTitle3', '顶栏文字（我）', '我']
  ];

  const save = async (msg) => {
    const patch = {};
    $('content').querySelectorAll('input[data-k]').forEach((el) => {
      const k = el.getAttribute('data-k');
      const raw = el.value.trim();
      /* 空 = 恢复默认；填的值正好等于默认值也按「恢复默认」处理 ——
         服务器那边收到空值就把这个键删掉，等于回到程序里的默认值。
         这样「恢复默认」是幂等的：之后再保存别的格子，它也不会被写回去。 */
      const def = DEF[k];
      const sameAsDefault = raw !== '' && (typeof def === 'number'
        ? Number(raw) === def
        : String(def === undefined ? '' : def).trim() === raw);
      if (!raw || sameAsDefault) { patch[k] = ''; return; }
      const num = Number(raw);
      patch[k] = (raw.charAt(0) === '#') ? raw : (isFinite(num) ? num : raw);
    });
    try {
      await api('/uiconfig', { method: 'POST', body: { ui: patch } });
      toast(msg || '已保存，App 切回来就生效');
    } catch (e) { toast(e.message); }
  };
  /* 每个字段的默认值（点「恢复默认」就写回它） */
  const DEF = {};
  NUM_FIELDS.forEach(([k, , d]) => { DEF[k] = d; });
  COLOR_FIELDS.forEach(([k, , d]) => { DEF[k] = d; });
  let saveTimer = null;
  const saveSoon = (msg) => { clearTimeout(saveTimer); saveTimer = setTimeout(() => save(msg), 700); };

  const draw = () => {
    /* 每行右边那个「恢复默认」：点了就把这一格清掉（服务器删键 → 回默认值），马上生效 */
    const resetBtn = (key, label) => writable
      ? '<button class="btn sm ghost" data-reset="' + key + '" title="把「' + label + '」恢复成默认">恢复默认</button>'
      : '';
    const changedTag = (key) => (ui[key] === undefined
      ? '<span class="hint" style="color:var(--ink3)">默认</span>'
      : '<span class="tag g">已改</span>');
    $('content').innerHTML = '<div class="panel"><div class="body">'
      + '<div class="filters"><span class="hint">这里改的是全站界面：字号、颜色。<b>颜色点色块直接选</b>，'
      + '左边的色块=浅色模式，右边的=深色模式；也可以直接在右边文本框里手写「#浅色|#深色」。'
      + '每一格后面的<b>恢复默认</b>只还原那一格，不影响别的。' + (writable ? '' : '（当前账号只能看，不能改）') + '</span></div>'
      + '<h3 style="margin:14px 0 6px">字号</h3>'
      /* 四个首页顶栏文字（纯文字，留空用默认） */
      + '<h3 style="margin:14px 0 6px">顶栏文字</h3>'
      + TEXT_FIELDS.map(([key, label, def]) => '<div class="row" style="margin:8px 0">'
        + '<span class="field-label" style="width:170px">' + label + '</span>'
        + '<input data-k="' + key + '" value="' + esc(ui[key] === undefined ? '' : ui[key]) + '" placeholder="' + esc(def) + '" style="width:220px"'
        + (writable ? '' : ' disabled') + '>'
        + resetBtn(key, label) + '</div>').join('')
      + NUM_FIELDS.map(([key, label, def, hint]) => '<div class="row" style="margin:8px 0">'
        + '<span class="field-label" style="width:170px">' + label + '</span>'
        + '<input data-k="' + key + '" value="' + esc(ui[key] === undefined ? def : ui[key]) + '" style="width:120px"'
        + (writable ? '' : ' disabled') + '>'
        + resetBtn(key, label)
        + changedTag(key)
        + '<span class="hint">' + hint + '</span></div>').join('')
      + '<h3 style="margin:18px 0 6px">颜色（点色块选）</h3>'
      + COLOR_FIELDS.map(([key, label, def]) => '<div class="row" style="margin:8px 0">'
        + '<span class="field-label" style="width:170px">' + label + '</span>'
        + (writable ? colorPairHtml(key, ui[key] === undefined ? def : ui[key]) : '')
        + '<input data-k="' + key + '" value="' + esc(ui[key] === undefined ? def : ui[key]) + '" style="width:190px;margin-left:6px"'
        + (writable ? '' : ' disabled') + '>'
        + resetBtn(key, label)
        + changedTag(key)
        + '<span class="hint">浅色|深色</span></div>').join('')
      + (writable ? '<div class="row" style="margin-top:16px"><button class="btn" id="uiSave">保存并推送</button>'
        + '<button class="btn ghost" id="uiReload">重新读取</button>'
        + '<button class="btn ghost" id="uiResetAll">全部恢复默认</button></div>' : '')
      + '</div></div>';

    if (!writable) return;
    /* 文字框改完：700ms 自动保存 */
    $('content').querySelectorAll('input[data-k]').forEach((el) => {
      el.addEventListener('change', () => saveSoon());
    });
    /* 色板：选完色写回同行的文本框，再自动保存 */
    [['data-light', 0], ['data-dark', 1]].forEach(([attr, pos]) => {
      $('content').querySelectorAll('input[' + attr + ']').forEach((el) => {
        el.addEventListener('input', () => {
          const box = $('content').querySelector('input[data-k="' + el.getAttribute(attr) + '"]');
          if (!box) return;
          const parts = String(box.value || '').split('|');
          if (pos === 1) { parts[0] = parts[0] || el.value; parts[1] = el.value; }
          else { parts[0] = el.value; if (parts.length === 1) parts[1] = el.value; }
          box.value = parts.join('|');
          box.dispatchEvent(new Event('change', { bubbles: true }));
        });
      });
    });
    $('uiSave').addEventListener('click', () => save('已保存，App 切回来就生效'));
    $('uiReload').addEventListener('click', () => PAGES.uiconfig());
    /* 每一格的「恢复默认」 */
    $('content').querySelectorAll('[data-reset]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const k = btn.getAttribute('data-reset');
        const box = $('content').querySelector('input[data-k="' + k + '"]');
        if (box) box.value = DEF[k] === undefined ? '' : DEF[k];
        await save('这一格已恢复默认' + (box && box.value ? '（' + box.value + '）' : ''));
        PAGES.uiconfig();       // 重新画一遍，那一行会变成「默认」
      });
    });
    const all = $('uiResetAll');
    if (all) all.addEventListener('click', () => {
      if (!confirm('把「界面文字」里所有改过的字号、颜色全部恢复成默认？')) return;
      $('content').querySelectorAll('input[data-k]').forEach((el) => {
        const k = el.getAttribute('data-k');
        el.value = DEF[k] === undefined ? '' : DEF[k];
      });
      save('全部已恢复默认');
      setTimeout(() => PAGES.uiconfig(), 900);
    });
  };
  draw();
};

/* ============================================================ 我的页
   和发现页同一套：加行、删行、改名、换图标、改颜色、调顺序、开关。 */
PAGES.mepage = async () => {
  const d = await api('/mepage');
  const icons = await api('/icons');
  const iconList = (icons.defaults || []).filter((it) => /^(i|tab|plus|ui)\./.test(it.key));
  let items = (d.items || []).map((x) => Object.assign({}, x));
  const writable = can('icons.write');
  const ACTION_NAME = {
    service: '服务', favorites: '收藏', moments: '朋友圈', works: '作品',
    stickers: '表情', settings: '设置', soon: '占位（还没做）'
  };

  /* 加行 / 删行 / 调顺序：改完立刻保存，不用再点按钮 */
  const save = async (msg) => {
    try {
      await api('/mepage', { method: 'POST', body: { items } });
      toast(msg || '已保存，前端马上生效');
    } catch (e) { toast(e.message); }
  };
  let saveTimer = null;
  const saveSoon = (msg) => { clearTimeout(saveTimer); saveTimer = setTimeout(() => save(msg), 600); };

  const iconPreview = (it) => {
    const v = (icons.overrides || {})[it.icon] || (iconList.find((x) => x.key === it.icon) || {}).svg || it.svg || '';
    if (v && v.indexOf('<svg') === 0) return '<span class="iprev" style="color:' + esc(it.color || '#4A90D9') + '">' + v + '</span>';
    if (v && /^(https?:|\/uploads|data:)/.test(v)) return '<span class="iprev"><img src="' + esc(v) + '" alt=""></span>';
    return '<span class="iprev sf">?</span>';
  };

  const draw = () => {
    $('content').innerHTML =
      '<div class="panel"><div class="body">'
      + '<div class="filters"><span class="hint">我页现在有 <b>' + items.length + '</b> 行；'
      + '同一「分组」的行排在一张卡片里。头像、名字那块资料卡不在这里，它是固定的。'
      + (writable ? '' : '（当前账号只能看，不能改）') + '</span></div>'
      + '<table class="tbl"><thead><tr>'
      + '<th style="width:64px">图标</th><th style="width:150px">名称</th><th style="width:210px">图标标识</th>'
      + '<th style="width:110px">颜色</th><th style="width:170px">点击动作</th><th style="width:80px">分组</th>'
      + '<th style="width:70px">显示</th><th style="width:190px">操作</th></tr></thead><tbody>'
      + items.map((it, i) => '<tr>'
        + '<td>' + iconPreview(it) + '</td>'
        + '<td><input data-f="label" data-i="' + i + '" value="' + esc(it.label) + '"' + (writable ? '' : ' disabled') + '></td>'
        + '<td><select data-f="icon" data-i="' + i + '"' + (writable ? '' : ' disabled') + '>'
        + '<option value="">（默认）</option>'
        + iconList.map((x) => '<option value="' + esc(x.key) + '"' + (it.icon === x.key ? ' selected' : '') + '>' + esc(x.key) + '</option>').join('')
        + '</select></td>'
        + '<td>' + colorPairHtml('row' + i, it.color) + '<input data-f="color" data-i="' + i + '" value="' + esc(it.color || '#4A90D9') + '" style="width:80px;margin-left:4px"' + (writable ? '' : ' disabled') + '></td>'
        + '<td><select data-f="action" data-i="' + i + '"' + (writable ? '' : ' disabled') + '>'
        + (d.actions || []).map((a) => '<option value="' + a + '"' + (it.action === a ? ' selected' : '') + '>'
          + (ACTION_NAME[a] || a) + '</option>').join('')
        + '</select></td>'
        + '<td><input data-f="group" data-i="' + i + '" value="' + (it.group || 1) + '" style="width:60px"' + (writable ? '' : ' disabled') + '></td>'
        + '<td>' + (writable
          ? '<input type="checkbox" data-f="enabled" data-i="' + i + '"' + (it.enabled !== false ? ' checked' : '') + '>'
          : (it.enabled !== false ? '显示' : '隐藏')) + '</td>'
        + '<td>' + (writable
          ? '<button class="btn sm ghost" data-up="' + i + '">↑</button> '
            + '<button class="btn sm ghost" data-down="' + i + '">↓</button> '
            + '<button class="btn sm danger" data-del="' + i + '">删除</button>'
          : '') + '</td></tr>').join('')
      + '</tbody></table>'
      + (writable
        ? '<div class="row" style="margin-top:12px"><button class="btn" id="mAdd">＋ 加一行</button>'
          + '<button class="btn ghost" id="mReset">恢复默认</button>'
          + '<button class="btn" id="mSave">保存并推送</button></div>'
        : '')
      + '</div></div>';

    if (!writable) return;
    $('content').querySelectorAll('input[data-f],select[data-f]').forEach((el) => {
      el.addEventListener('change', () => {
        const i = Number(el.getAttribute('data-i'));
        const f = el.getAttribute('data-f');
        items[i][f] = f === 'enabled' ? el.checked : el.value;
        if (f === 'icon') draw();
        saveSoon('已保存，前端马上生效');
      });
    });
    $('content').querySelectorAll('[data-up]').forEach((b) => b.addEventListener('click', () => {
      const i = Number(b.getAttribute('data-up'));
      if (i <= 0) return;
      const t = items[i - 1]; items[i - 1] = items[i]; items[i] = t; draw(); save('顺序已保存');
    }));
    $('content').querySelectorAll('[data-down]').forEach((b) => b.addEventListener('click', () => {
      const i = Number(b.getAttribute('data-down'));
      if (i >= items.length - 1) return;
      const t = items[i + 1]; items[i + 1] = items[i]; items[i] = t; draw(); save('顺序已保存');
    }));
    $('content').querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => {
      const i = Number(b.getAttribute('data-del'));
      if (!confirm('删掉「' + (items[i].label || '') + '」这一行？')) return;
      items.splice(i, 1); draw(); save('已删掉这一行');
    }));
    $('mAdd').addEventListener('click', () => {
      const last = items[items.length - 1] || { group: 1 };
      items.push({
        id: 'm' + Date.now().toString(36), label: '新入口', icon: '', color: '#4A90D9',
        action: 'soon', group: (last.group || 1) + 1, enabled: true, svg: ''
      });
      draw(); save('已加一行，去前台看看');
    });
    $('mReset').addEventListener('click', () => {
      if (!confirm('恢复成默认的我页？（当前改动会丢）')) return;
      items = (d.defaults || []).map((x) => Object.assign({}, x));
      draw(); save('已恢复默认');
    });
    $('mSave').addEventListener('click', async () => {
      try {
        await api('/mepage', { method: 'POST', body: { items } });
        toast('已保存，网页版和 App 马上生效');
      } catch (e) { toast(e.message); }
    });
  };
  draw();
};

  const styleRow = (label, inner) => '<tr><td style="width:150px;color:#8a8a8a">' + label + '</td><td>' + inner + '</td></tr>';
